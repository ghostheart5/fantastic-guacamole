<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure ChronoSpark authentication callback fallback.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Return to ChronoSpark</title>
</head>
<body>
  <main>
    <h1>Return to ChronoSpark</h1>
    <p>
      This secure sign-in link should open the installed ChronoSpark app.
      If it did not, use the button below on the Android device where
      ChronoSpark is installed.
    </p>
    <p><a id="retry-app-link" href="https://chronospark.app/app/auth/callback">Open ChronoSpark</a></p>
    <p>This page never displays or sends authentication parameters.</p>
  </main>
  <script>
    document.getElementById('retry-app-link').href = window.location.href;
  </script>
</body>
</html>
