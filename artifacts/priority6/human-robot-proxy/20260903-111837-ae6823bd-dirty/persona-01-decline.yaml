appId: com.ghostheart5.chronospark
name: "P6 proxy persona 01 - privacy cautious decline"
tags:
  - priority6
  - human-robot-proxy
---
- launchApp:
    clearState: true
- runFlow: ../../../../.maestro/subflows/sign-in.yaml
- extendedWaitUntil:
    visible: "NEXUS"
    timeout: 30000
- runFlow:
    file: ../../../../.maestro/subflows/open-from-nexus.yaml
    env:
      TARGET: "Smart Planner"
- assertNotVisible: "Add optional context"
- tapOn: "Not set"
- inputText: "Choose one useful release step today"
- scrollUntilVisible:
    element:
      text: "GET GUIDANCE"
    direction: DOWN
    timeout: 15000
- tapOn: "GET GUIDANCE"
- extendedWaitUntil:
    visible: "(?s)Planning guidance ready.*"
    timeout: 30000
- assertVisible: "Use this plan"
- scrollUntilVisible:
    element:
      text: "Add optional context"
    direction: DOWN
    timeout: 15000
- assertVisible: "(?s).*Nothing is inferred.*Use only this time remains the default.*Smart Planner only.*30 days.*close ranking tie.*"
- takeScreenshot: persona-01-offer
- tapOn: "Not now"
- assertVisible: "Use this plan"
- assertNotVisible: "Add optional context"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "NEXUS"
    timeout: 15000
- tapOn: "CONTEXT"
- extendedWaitUntil:
    visible: "PERSON CONTEXT"
    timeout: 15000
- assertVisible: "Right now\nNot provided"
- scrollUntilVisible:
    element:
      text: "Review and correct\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Review and correct\n.*"
- assertVisible: "Not provided. ChronoSpark will not invent personal context."
- takeScreenshot: persona-01-no-durable-context
