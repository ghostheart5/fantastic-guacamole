# Keep local builds usable alongside an emulator on a 16 GB development PC.
# Heap and worker limits match the hosted native validation environment.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon.idletimeout=120000
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true

# Locked app identity/version defaults for release builds.
CHRONOSPARK_APPLICATION_ID=com.ghostheart5.chronospark
CHRONOSPARK_VERSION_CODE=2026083027
CHRONOSPARK_VERSION_NAME=4.1.0
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
