name: Backend Reconciliation

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronospark-production-backend-reconciliation
  cancel-in-progress: false

jobs:
  account-deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Resume pending account deletions
        env:
          SUPABASE_URL: ${{ secrets.CHRONOSPARK_SUPABASE_URL }}
          RECONCILE_SECRET: ${{ secrets.ACCOUNT_DELETE_RECONCILE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$RECONCILE_SECRET" ]; then
            echo "::error::Production reconciliation configuration is incomplete."
            exit 1
          fi
          curl --fail --silent --show-error \
            --output /dev/null \
            --retry 2 --retry-all-errors --max-time 45 \
            -X POST "$SUPABASE_URL/functions/v1/account-delete-reconcile" \
            -H "x-chronospark-reconcile-secret: $RECONCILE_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}'
