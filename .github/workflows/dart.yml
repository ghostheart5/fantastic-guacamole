# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Extended Dart Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinning by commit SHA keeps CI builds reproducible and avoids
      # unexpected behavior changes from upstream action updates.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      # .env is declared as a Flutter asset in pubspec.yaml and must exist on
      # the CI runner before flutter pub get runs. It is git-ignored, so we
      # create it from the checked-in example file. No secrets are committed —
      # every value in .env.example is blank or a safe local-dev default.
      - name: Create .env for CI
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Run secret content guard
        shell: pwsh
        run: ./scripts/secret_content_guard.ps1

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Validate version consistency
        shell: pwsh
        run: ./scripts/version_consistency_guard.ps1

      # Executing Maestro flows needs a booted device, which this job does not
      # have. This parses them and checks every runFlow target resolves, so a
      # broken flow is caught on push rather than on the next device run.
      - name: Validate Maestro flows
        run: dart run tool/validate_maestro_flows.dart

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.1.4

      - name: Type-check and test all Edge Functions
        shell: pwsh
        run: ./scripts/edge_function_gate.ps1 -RunTests

      - name: Generate dependency audit evidence
        shell: pwsh
        run: ./scripts/dependency_audit.ps1

      - name: Run tests
        run: flutter test test --coverage --concurrency=1

      - name: Run app-root integration tests
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Enforce coverage and critical-test contracts
        shell: pwsh
        run: ./scripts/coverage_guard.ps1 -Mode ratchet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage/lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
