name: Public Release Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full source commit SHA
        required: true
        type: string
      packet:
        description: Reviewed JSON receipt and six record texts; never include credentials
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    if: github.actor == 'ghostheart5'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - name: Checkout reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require protected main ancestry before exposing service settings
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - name: Validate packet and effective public configuration
        env:
          PUBLIC_EVIDENCE_PACKET: ${{ inputs.packet }}
          CHRONOSPARK_SUPABASE_URL: ${{ secrets.CHRONOSPARK_SUPABASE_URL }}
          CHRONOSPARK_SUPABASE_ANON_KEY: ${{ secrets.CHRONOSPARK_SUPABASE_ANON_KEY }}
          CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT: ${{ secrets.CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT }}
          CHRONOSPARK_AI_PROXY_ENDPOINT: ${{ secrets.CHRONOSPARK_AI_PROXY_ENDPOINT }}
          CHRONOSPARK_AI_REPORT_ENDPOINT: ${{ secrets.CHRONOSPARK_AI_REPORT_ENDPOINT }}
          CHRONOSPARK_PLANNER_EXPLANATION_ENDPOINT: ${{ secrets.CHRONOSPARK_PLANNER_EXPLANATION_ENDPOINT }}
          CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT: ${{ secrets.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT }}
          CHRONOSPARK_ANDROID_SHA256_CERT: ${{ secrets.CHRONOSPARK_ANDROID_SHA256_CERT }}
        run: python3 scripts/publish_public_release_evidence.py --output "$RUNNER_TEMP/public-release-evidence"
      - name: Upload validated operator evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-public-evidence-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-release-evidence/
          if-no-files-found: error
          retention-days: 90
