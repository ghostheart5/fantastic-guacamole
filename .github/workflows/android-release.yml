name: Android Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  database-gate:
    uses: ./.github/workflows/supabase-database.yml

  public-infrastructure-gate:
    runs-on: ubuntu-latest
    env:
      PLAY_APP_SIGNING_SHA256: ${{ secrets.CHRONOSPARK_ANDROID_SHA256_CERT }}
    steps:
      - name: Verify legal pages, account deletion, and Android App Links
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          def fetch(url: str) -> bytes:
              request = Request(url, headers={'User-Agent': 'ChronoSpark-Release-Gate/1.0'})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{url} returned HTTP {response.status}')
                  return response.read()

          required_pages = {
              'https://ghostheart5.github.io/fantastic-guacamole/privacy/':
                  ('ChronoSpark Privacy Policy', 'account-deletion page'),
              'https://ghostheart5.github.io/fantastic-guacamole/terms/':
                  ('ChronoSpark Terms of Service', 'does not automatically cancel'),
              'https://ghostheart5.github.io/fantastic-guacamole/support/':
                  ('ChronoSpark Support', 'account-deletion page'),
              'https://ghostheart5.github.io/fantastic-guacamole/delete-account/':
                  ('Delete a ChronoSpark Account', 'Request deletion without the app'),
              'https://chronospark.app/app/auth/callback':
                  ('Return to ChronoSpark', 'never displays or sends authentication parameters'),
          }
          for url, markers in required_pages.items():
              body = fetch(url).decode('utf-8')
              missing = [marker for marker in markers if marker not in body]
              if missing:
                  raise RuntimeError(f'{url} is missing required markers: {missing}')

          expected = re.sub(
              r'[^0-9A-F]',
              '',
              os.environ.get('PLAY_APP_SIGNING_SHA256', '').upper(),
          )
          if len(expected) != 64:
              raise RuntimeError(
                  'CHRONOSPARK_ANDROID_SHA256_CERT must contain the Play App Signing SHA-256 fingerprint'
              )

          statements = json.loads(
              fetch('https://chronospark.app/.well-known/assetlinks.json')
          )
          fingerprints = {
              re.sub(r'[^0-9A-F]', '', fingerprint.upper())
              for statement in statements
              if statement.get('target', {}).get('namespace') == 'android_app'
              and statement.get('target', {}).get('package_name')
                  == 'com.ghostheart5.chronospark'
              for fingerprint in statement.get('target', {}).get(
                  'sha256_cert_fingerprints', []
              )
          }
          if expected not in fingerprints:
              raise RuntimeError(
                  'chronospark.app does not publish the configured Play App Signing SHA-256 fingerprint'
              )
          PY

  build-aab:
    needs: [database-gate, public-infrastructure-gate]
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64_SECRET: ANDROID_GOOGLE_SERVICES_JSON_BASE64
      ANDROID_GOOGLE_SERVICES_JSON_SECRET: ANDROID_GOOGLE_SERVICES_JSON
      CHRONOSPARK_SUPABASE_URL_SECRET: CHRONOSPARK_SUPABASE_URL
      CHRONOSPARK_SUPABASE_ANON_KEY_SECRET: CHRONOSPARK_SUPABASE_ANON_KEY
      CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT_SECRET: CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT
      CHRONOSPARK_AI_PROXY_ENDPOINT_SECRET: CHRONOSPARK_AI_PROXY_ENDPOINT
      CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT_SECRET: CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT
      CHRONOSPARK_ANDROID_SHA256_CERT_SECRET: CHRONOSPARK_ANDROID_SHA256_CERT

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release source and version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit must be reachable from origin/main."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pubspec = Path('pubspec.yaml').read_text(encoding='utf-8')
          version_match = re.search(
              r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$',
              pubspec,
              re.MULTILINE,
          )
          if version_match is None:
              raise SystemExit('::error::pubspec.yaml must contain a semantic version and numeric build number.')

          version_name, version_code = version_match.groups()
          properties = {}
          for raw_line in Path('android/gradle.properties').read_text(encoding='utf-8').splitlines():
              line = raw_line.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              properties[key.strip()] = value.strip()

          if properties.get('CHRONOSPARK_VERSION_NAME') != version_name:
              raise SystemExit('::error::Android version name does not match pubspec.yaml.')
          if properties.get('CHRONOSPARK_VERSION_CODE') != version_code:
              raise SystemExit('::error::Android version code does not match pubspec.yaml.')

          ref_type = os.environ['GITHUB_REF_TYPE']
          ref_name = os.environ['GITHUB_REF_NAME']
          if ref_type == 'tag':
              pattern = rf'^v{re.escape(version_name)}(?:-(?:alpha|beta|rc|pre)[0-9A-Za-z.-]*)?$'
              if re.fullmatch(pattern, ref_name) is None:
                  raise SystemExit(
                      f'::error::Release tag {ref_name!r} does not match app version v{version_name}.'
                  )
          elif ref_name != 'main':
              raise SystemExit('::error::Manual production releases must run from main.')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Write client configuration asset
        env:
          SUPABASE_URL: ${{ secrets[env.CHRONOSPARK_SUPABASE_URL_SECRET] }}
          SUPABASE_ANON_KEY: ${{ secrets[env.CHRONOSPARK_SUPABASE_ANON_KEY_SECRET] }}
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "::error::CHRONOSPARK_SUPABASE_URL is required for release."; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::CHRONOSPARK_SUPABASE_ANON_KEY is required for release."; exit 1; }
          cat > .env << EOF
          CHRONOSPARK_SUPABASE_URL=$SUPABASE_URL
          CHRONOSPARK_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Android release guard
        shell: pwsh
        run: ./scripts/release_guard.ps1

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ ! -s android/app/key.jks ]; then
            echo "::error::Decoded keystore is missing or empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD are required."
            exit 1
          fi
          RESOLVED_ALIAS="$KEY_ALIAS"
          if [ -z "$RESOLVED_ALIAS" ]; then
            RESOLVED_ALIAS=$(keytool -list -keystore android/app/key.jks -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F, 'NR > 1 {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); if ($1 != "") {print $1; exit}}')
          fi
          if [ -z "$RESOLVED_ALIAS" ]; then
            echo "::error::Unable to resolve keystore alias. Set ANDROID_KEY_ALIAS secret."
            exit 1
          fi
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$RESOLVED_ALIAS
          storeFile=app/key.jks
          EOF
          echo "Using keystore alias: $RESOLVED_ALIAS"

      - name: Verify upload key fingerprint
        env:
          EXPECTED_UPLOAD_SHA1: "8A:24:D7:BA:AC:AB:52:F0:A3:77:7D:D0:47:C9:07:96:2E:82:FA:A5"
        run: |
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/key.jks -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" -alias "$(awk -F= '$1=="keyAlias" {print $2}' android/key.properties)" 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}')
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Unable to read upload key SHA1 fingerprint from android/app/key.jks"
            exit 1
          fi
          echo "Resolved upload key SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_UPLOAD_SHA1" ]; then
            echo "::error::Upload key SHA1 mismatch. Expected $EXPECTED_UPLOAD_SHA1 but found $ACTUAL_SHA1"
            exit 1
          fi

      - name: Configure optional Firebase Android file
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets[env.ANDROID_GOOGLE_SERVICES_JSON_BASE64_SECRET] }}
          GOOGLE_SERVICES_JSON: ${{ secrets[env.ANDROID_GOOGLE_SERVICES_JSON_SECRET] }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
            echo "Configured android/app/google-services.json from ANDROID_GOOGLE_SERVICES_JSON_BASE64."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Configured android/app/google-services.json from ANDROID_GOOGLE_SERVICES_JSON."
          else
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON(_BASE64) is required for release builds."
            exit 1
          fi

      - name: Verify Firebase Android configuration identity
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          google = json.loads(Path('android/app/google-services.json').read_text(encoding='utf-8'))
          flutterfire = json.loads(Path('firebase.json').read_text(encoding='utf-8'))
          dart_source = Path('lib/firebase_options.dart').read_text(encoding='utf-8')

          expected_package = 'com.ghostheart5.chronospark'
          android_config = flutterfire['flutter']['platforms']['android']['default']
          clients = [
              client for client in google.get('client', [])
              if client.get('client_info', {}).get('android_client_info', {}).get('package_name')
                  == expected_package
          ]
          if len(clients) != 1:
              raise SystemExit('::error::google-services.json must contain exactly one production Android client.')
          client = clients[0]
          api_keys = client.get('api_key', [])
          if len(api_keys) != 1:
              raise SystemExit('::error::Production Firebase client must contain exactly one API key entry.')

          dart_android_match = re.search(
              r'static const FirebaseOptions android = FirebaseOptions\((.*?)\n\s*\);',
              dart_source,
              re.DOTALL,
          )
          if dart_android_match is None:
              raise SystemExit('::error::Unable to locate Android FirebaseOptions.')

          def dart_value(field: str) -> str:
              match = re.search(
                  rf"\b{re.escape(field)}:\s*'([^']+)'",
                  dart_android_match.group(1),
              )
              if match is None:
                  raise SystemExit(f'::error::Android FirebaseOptions is missing {field}.')
              return match.group(1)

          project_info = google.get('project_info', {})
          client_info = client.get('client_info', {})
          actual = {
              'projectId': project_info.get('project_id'),
              'appId': client_info.get('mobilesdk_app_id'),
              'messagingSenderId': str(project_info.get('project_number', '')),
              'storageBucket': project_info.get('storage_bucket'),
              'apiKey': api_keys[0].get('current_key'),
          }
          expected = {
              'projectId': android_config.get('projectId'),
              'appId': android_config.get('appId'),
              'messagingSenderId': dart_value('messagingSenderId'),
              'storageBucket': dart_value('storageBucket'),
              'apiKey': dart_value('apiKey'),
          }
          mismatches = sorted(key for key in expected if not actual[key] or actual[key] != expected[key])
          if mismatches:
              raise SystemExit(
                  '::error::Firebase Android configuration mismatch in: ' + ', '.join(mismatches)
              )
          if dart_value('projectId') != expected['projectId'] or dart_value('appId') != expected['appId']:
              raise SystemExit('::error::firebase.json and Android FirebaseOptions identify different apps.')
          PY

      - name: Validate production configuration
        env:
          SUPABASE_URL: ${{ secrets[env.CHRONOSPARK_SUPABASE_URL_SECRET] }}
          SUPABASE_ANON_KEY: ${{ secrets[env.CHRONOSPARK_SUPABASE_ANON_KEY_SECRET] }}
          RECEIPT_ENDPOINT: ${{ secrets[env.CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT_SECRET] }}
          AI_ENDPOINT: ${{ secrets[env.CHRONOSPARK_AI_PROXY_ENDPOINT_SECRET] }}
          DELETE_ENDPOINT: ${{ secrets[env.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT_SECRET] }}
          ANDROID_SHA256: ${{ secrets[env.CHRONOSPARK_ANDROID_SHA256_CERT_SECRET] }}
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "::error::CHRONOSPARK_SUPABASE_URL is required for release."; exit 1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::CHRONOSPARK_SUPABASE_ANON_KEY is required for release."; exit 1; }
          [ -n "$RECEIPT_ENDPOINT" ] || { echo "::error::CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT is required for release."; exit 1; }
          [ -n "$AI_ENDPOINT" ] || { echo "::error::CHRONOSPARK_AI_PROXY_ENDPOINT is required for release."; exit 1; }
          [ -n "$DELETE_ENDPOINT" ] || { echo "::error::CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT is required for release."; exit 1; }
          [ -n "$ANDROID_SHA256" ] || { echo "::error::CHRONOSPARK_ANDROID_SHA256_CERT must contain the Google Play App Signing SHA-256 fingerprint."; exit 1; }
          echo "PROD_READINESS=true" >> "$GITHUB_ENV"

      - name: Verify Play signing certificate is published for App Links
        env:
          PLAY_APP_SIGNING_SHA256: ${{ secrets[env.CHRONOSPARK_ANDROID_SHA256_CERT_SECRET] }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def normalize(value: str) -> str:
              return re.sub(r'[^0-9A-F]', '', value.upper())

          expected = normalize(os.environ['PLAY_APP_SIGNING_SHA256'])
          if len(expected) != 64:
              raise SystemExit(
                  '::error::CHRONOSPARK_ANDROID_SHA256_CERT must be a 32-byte SHA-256 fingerprint from Play Console > App integrity.'
              )

          statements = json.loads(
              Path('web/.well-known/assetlinks.json').read_text(encoding='utf-8')
          )
          fingerprints = {
              normalize(fingerprint)
              for statement in statements
              if statement.get('target', {}).get('namespace') == 'android_app'
              and statement.get('target', {}).get('package_name')
                  == 'com.ghostheart5.chronospark'
              for fingerprint in statement.get('target', {}).get(
                  'sha256_cert_fingerprints', []
              )
          }
          if expected not in fingerprints:
              raise SystemExit(
                  '::error::The Play App Signing SHA-256 fingerprint is missing from web/.well-known/assetlinks.json.'
              )
          PY

      - name: Run tests
        run: flutter test

      - name: Build signed AAB
        env:
          CHRONOSPARK_BUILD_PROFILE: production
        run: >-
          flutter build appbundle --release
          --dart-define=CHRONOSPARK_APP_FLAVOR=prod
          --dart-define=CHRONOSPARK_ENFORCE_PROD_READINESS=true
          --dart-define=CHRONOSPARK_MAESTRO_MODE=false
          --dart-define=CHRONOSPARK_ENABLE_MOCK_LOGIN=false
          --dart-define=CHRONOSPARK_ENABLE_MOCK_MODE=false
          --dart-define=CHRONOSPARK_PAYWALL_DISABLED=false
          --dart-define=CHRONOSPARK_ENABLE_TESTER_FULL_ACCESS=false
          --dart-define=CHRONOSPARK_SUPABASE_URL=${{ secrets[env.CHRONOSPARK_SUPABASE_URL_SECRET] }}
          --dart-define=CHRONOSPARK_SUPABASE_ANON_KEY=${{ secrets[env.CHRONOSPARK_SUPABASE_ANON_KEY_SECRET] }}
          --dart-define=CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT=${{ secrets[env.CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT_SECRET] }}
          --dart-define=CHRONOSPARK_AI_PROXY_ENDPOINT=${{ secrets[env.CHRONOSPARK_AI_PROXY_ENDPOINT_SECRET] }}
          --dart-define=CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT=${{ secrets[env.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT_SECRET] }}
          --dart-define=CHRONOSPARK_ANDROID_SHA256_CERT=${{ secrets[env.CHRONOSPARK_ANDROID_SHA256_CERT_SECRET] }}
          --dart-define=CHRONOSPARK_OAUTH_REDIRECT_URL=https://chronospark.app/app/auth/callback
          --dart-define=CHRONOSPARK_PASSWORD_RECOVERY_REDIRECT_URL=https://chronospark.app/app/auth/callback
          --dart-define=CHRONOSPARK_GITHUB_OAUTH_REDIRECT_URL=https://chronospark.app/app/auth/callback

      - name: Inspect signed AAB and collect release evidence
        env:
          EXPECTED_UPLOAD_SHA1: "8A:24:D7:BA:AC:AB:52:F0:A3:77:7D:D0:47:C9:07:96:2E:82:FA:A5"
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          EVIDENCE_DIR="build/release-evidence"
          mkdir -p "$EVIDENCE_DIR"

          jarsigner -verify -verbose -certs "$AAB" > "$EVIDENCE_DIR/jarsigner.txt"
          grep -q "jar verified" "$EVIDENCE_DIR/jarsigner.txt" || {
            echo "::error::The release AAB does not have a valid JAR signature."
            exit 1
          }

          keytool -printcert -jarfile "$AAB" > "$EVIDENCE_DIR/signer-certificate.txt"
          ACTUAL_SHA1=$(awk -F': ' '/SHA1:/{print $2; exit}' "$EVIDENCE_DIR/signer-certificate.txt")
          if [ "$ACTUAL_SHA1" != "$EXPECTED_UPLOAD_SHA1" ]; then
            echo "::error::The signed AAB uses an unexpected upload certificate."
            exit 1
          fi

          VERSION_NAME=$(awk -F= '$1=="CHRONOSPARK_VERSION_NAME" {print $2}' android/gradle.properties)
          VERSION_CODE=$(awk -F= '$1=="CHRONOSPARK_VERSION_CODE" {print $2}' android/gradle.properties)
          python3 scripts/validate_android_release_artifact.py \
            --aab "$AAB" \
            --expected-package com.ghostheart5.chronospark \
            --expected-version-name "$VERSION_NAME" \
            --expected-version-code "$VERSION_CODE" \
            --minimum-target-sdk 35 \
            --output "$EVIDENCE_DIR/release-evidence.json"

          git rev-parse HEAD > "$EVIDENCE_DIR/commit.txt"
          flutter --version > "$EVIDENCE_DIR/flutter-version.txt"
          sha256sum "$AAB" > "$EVIDENCE_DIR/app-release.aab.sha256"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: chronospark-release-evidence-${{ github.ref_name }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronospark-release-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') }}
