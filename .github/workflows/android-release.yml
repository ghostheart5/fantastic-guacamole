name: Android Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  database-gate:
    uses: ./.github/workflows/supabase-database.yml
    permissions:
      contents: read

  build-aab:
    needs: [quality-gate, database-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release source
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release checkout $ACTUAL_SHA does not match event commit $GITHUB_SHA."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked release checkout is dirty before validation."
            exit 1
          fi

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Verify deployed migrations, functions, and secret names
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for the production backend gate."; exit 1; }
          done
          mkdir -p build/release-evidence
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked > build/release-evidence/production-migrations.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('build/release-evidence/production-migrations.txt').read_text(encoding='utf-8')
          rows = 0
          mismatches = []
          for line in text.splitlines():
              parts = [part.strip() for part in line.replace('│', '|').split('|')]
              if len(parts) < 2:
                  continue
              local = parts[0] if re.fullmatch(r'\d{14}', parts[0]) else ''
              remote = parts[1] if re.fullmatch(r'\d{14}', parts[1]) else ''
              if not local and not remote:
                  continue
              rows += 1
              if local != remote:
                  mismatches.append((local or 'missing', remote or 'missing'))
          if rows == 0:
              raise SystemExit('::error::Unable to parse linked Supabase migration inventory.')
          if mismatches:
              raise SystemExit(f'::error::Production migration drift: {mismatches}')
          PY
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" \
            > build/release-evidence/production-functions.txt
          for function_name in \
            ai-proxy ai-report verify-receipt google-play-rtdn \
            account-delete account-delete-reconcile
          do
            grep -Eq "(^|[[:space:]|])${function_name}([[:space:]|]|$)" \
              build/release-evidence/production-functions.txt || {
                echo "::error::Production Edge Function is missing: $function_name"
                exit 1
              }
          done
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            > build/release-evidence/production-secret-names.txt
          for secret_name in \
            ANTHROPIC_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON ANDROID_PACKAGE_NAME \
            RTDN_AUDIENCE RTDN_SERVICE_ACCOUNT_EMAIL ACCOUNT_DELETE_RECONCILE_SECRET
          do
            grep -Eq "(^|[[:space:]|])${secret_name}([[:space:]|]|$)" \
              build/release-evidence/production-secret-names.txt || {
                echo "::error::Production Edge secret is missing: $secret_name"
                exit 1
              }
          done

      - name: Verify live backend, App Links, RTDN, and Play configuration
        env:
          CHRONOSPARK_SUPABASE_URL: ${{ secrets.CHRONOSPARK_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT: ${{ secrets.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RTDN_PUBSUB_SUBSCRIPTION: ${{ secrets.RTDN_PUBSUB_SUBSCRIPTION }}
          RTDN_AUDIENCE: ${{ secrets.RTDN_AUDIENCE }}
          RTDN_SERVICE_ACCOUNT_EMAIL: ${{ secrets.RTDN_SERVICE_ACCOUNT_EMAIL }}
          CHRONOSPARK_ANDROID_SHA256_CERT: ${{ secrets.CHRONOSPARK_ANDROID_SHA256_CERT }}
          ANDROID_PACKAGE_NAME: com.ghostheart5.chronospark
        run: >-
          node scripts/verify_production_backend.mjs
          > build/release-evidence/production-backend.json

      - name: Upload exact-commit backend evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-production-backend-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: build/release-evidence/

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Run secret content guard
        shell: pwsh
        run: ./scripts/secret_content_guard.ps1

      - name: Validate release version and tag
        shell: pwsh
        run: ./scripts/version_consistency_guard.ps1 -RequireTag

      - name: Run release source guard
        shell: pwsh
        run: ./scripts/release_guard.ps1

      - name: Verify formatting and analyze source
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --fatal-infos

      - name: Validate Maestro contracts
        run: dart run tool/validate_maestro_flows.dart

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.1.4

      - name: Type-check and test all Edge Functions
        shell: pwsh
        run: ./scripts/edge_function_gate.ps1 -RunTests

      - name: Run release tests before signing
        run: flutter test test --concurrency=1

      - name: Configure Firebase Android file
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON(_BASE64) is required for a production release."
            exit 1
          fi
          echo "Firebase Android configuration prepared."

      - name: Validate production configuration
        env:
          CHRONOSPARK_SUPABASE_URL: ${{ secrets.CHRONOSPARK_SUPABASE_URL }}
          CHRONOSPARK_SUPABASE_ANON_KEY: ${{ secrets.CHRONOSPARK_SUPABASE_ANON_KEY }}
          CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT: ${{ secrets.CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT }}
          CHRONOSPARK_AI_PROXY_ENDPOINT: ${{ secrets.CHRONOSPARK_AI_PROXY_ENDPOINT }}
          CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT: ${{ secrets.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT }}
          CHRONOSPARK_ANDROID_SHA256_CERT: ${{ secrets.CHRONOSPARK_ANDROID_SHA256_CERT }}
        run: >-
          dart run scripts/validate_production_config.dart
          --platform=android
          --google-services=android/app/google-services.json

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          if [ ! -s android/app/key.jks ]; then
            echo "::error::Decoded keystore is missing or empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD are required."
            exit 1
          fi
          RESOLVED_ALIAS="$KEY_ALIAS"
          if [ -z "$RESOLVED_ALIAS" ]; then
            RESOLVED_ALIAS=$(keytool -list -keystore android/app/key.jks -storepass:env STORE_PASSWORD 2>/dev/null | awk -F, 'NR > 1 {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); if ($1 != "") {print $1; exit}}')
          fi
          if [ -z "$RESOLVED_ALIAS" ]; then
            echo "::error::Unable to resolve keystore alias. Set ANDROID_KEY_ALIAS secret."
            exit 1
          fi
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$RESOLVED_ALIAS
          storeFile=app/key.jks
          EOF
          echo "Using keystore alias: $RESOLVED_ALIAS"

      - name: Verify upload key fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          EXPECTED_UPLOAD_SHA1: "8A:24:D7:BA:AC:AB:52:F0:A3:77:7D:D0:47:C9:07:96:2E:82:FA:A5"
        run: |
          ACTUAL_SHA1=$(keytool -list -v -keystore android/app/key.jks -storepass:env STORE_PASSWORD -alias "$(awk -F= '$1=="keyAlias" {print $2}' android/key.properties)" 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}')
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Unable to read upload key SHA1 fingerprint from android/app/key.jks"
            exit 1
          fi
          echo "Resolved upload key SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_UPLOAD_SHA1" ]; then
            echo "::error::Upload key SHA1 mismatch. Expected $EXPECTED_UPLOAD_SHA1 but found $ACTUAL_SHA1"
            exit 1
          fi

      - name: Create empty .env file for asset bundling
        run: touch .env

      - name: Build signed AAB
        env:
          SUPABASE_URL: ${{ secrets.CHRONOSPARK_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.CHRONOSPARK_SUPABASE_ANON_KEY }}
          RECEIPT_ENDPOINT: ${{ secrets.CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT }}
          AI_ENDPOINT: ${{ secrets.CHRONOSPARK_AI_PROXY_ENDPOINT }}
          DELETE_ENDPOINT: ${{ secrets.CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT }}
          ANDROID_SHA256: ${{ secrets.CHRONOSPARK_ANDROID_SHA256_CERT }}
        run: >-
          flutter build appbundle --release
          --dart-define=CHRONOSPARK_APP_FLAVOR=prod
          --dart-define=CHRONOSPARK_ENFORCE_PROD_READINESS=true
          --dart-define=CHRONOSPARK_VERBOSE_LOGS=false
          --dart-define=CHRONOSPARK_ENABLE_MOCK_LOGIN=false
          --dart-define=CHRONOSPARK_ENABLE_MOCK_MODE=false
          --dart-define=CHRONOSPARK_ENABLE_TESTER_FULL_ACCESS=false
          --dart-define=CHRONOSPARK_PAYWALL_DISABLED=false
          --dart-define=CHRONOSPARK_ENABLE_RUNTIME_FEATURE_FLAGS=false
          --dart-define=CHRONOSPARK_ENABLE_CLOUD_SYNC=false
          --dart-define=CHRONOSPARK_ENABLE_ANALYTICS=false
          --dart-define=CHRONOSPARK_ENABLE_CRASH_REPORTING=false
          --dart-define="CHRONOSPARK_SUPABASE_URL=$SUPABASE_URL"
          --dart-define="CHRONOSPARK_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          --dart-define="CHRONOSPARK_RECEIPT_VERIFY_ENDPOINT=$RECEIPT_ENDPOINT"
          --dart-define="CHRONOSPARK_AI_PROXY_ENDPOINT=$AI_ENDPOINT"
          --dart-define="CHRONOSPARK_ACCOUNT_DELETE_ENDPOINT=$DELETE_ENDPOINT"
          --dart-define="CHRONOSPARK_ANDROID_SHA256_CERT=$ANDROID_SHA256"

      - name: Verify and fingerprint release artifact
        run: |
          AAB_DIR=build/app/outputs/bundle/release
          AAB="$AAB_DIR/app-release.aab"
          test -s "$AAB"
          VERIFY_OUTPUT="$(jarsigner -verify "$AAB" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          grep -Fq 'jar verified.' <<< "$VERIFY_OUTPUT"
          ! grep -Fiq 'jar is unsigned' <<< "$VERIFY_OUTPUT"
          (
            cd "$AAB_DIR"
            sha256sum app-release.aab > app-release.aab.sha256
          )

      - name: Remove runner-only sensitive material
        if: always()
        run: rm -f android/app/key.jks android/key.properties android/app/google-services.json .env

      - name: Upload AAB artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256

  publish-release:
    needs: build-aab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download verified AAB artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chronospark-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Recheck AAB artifact digest
        working-directory: release-artifacts
        run: sha256sum --check app-release.aab.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/app-release.aab
            release-artifacts/app-release.aab.sha256
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') }}
