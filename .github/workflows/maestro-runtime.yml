name: Maestro Runtime Gate

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable QA source revision; defaults to the calling revision
        required: false
        type: string
      build_only:
        description: Build and retain a local QA APK without starting a device
        required: false
        type: boolean
        default: false
      ci_run:
        description: Successful exact-source CI run required for build-only
        required: false
        type: string
        default: ''
      apk_target_platform:
        required: false
        type: string
        default: android-x64
      storage_clearance_sha256:
        description: Reviewed no-added-charge clearance for 200 MiB of artifacts for seven days
        required: false
        type: string
        default: ''
      suite:
        required: false
        type: string
        default: qa-smoke
      run_monkey:
        required: false
        type: boolean
        default: false
      monkey_only:
        required: false
        type: boolean
        default: false
      guest_api:
        required: false
        type: string
        default: '35'
      guest_pages:
        required: false
        type: string
        default: '4k'
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable QA source SHA; defaults to this workflow revision
        required: false
        type: string
      build_only:
        description: Build and retain a local QA APK without starting a device
        required: false
        type: boolean
        default: false
      ci_run:
        description: Successful exact-source CI run required for build-only
        required: false
        type: string
        default: ''
      apk_target_platform:
        description: ABI for the retained QA APK
        required: false
        type: choice
        default: android-x64
        options:
          - android-arm64
          - android-x64
      storage_clearance_sha256:
        description: Reviewed no-added-charge clearance for 200 MiB of artifacts for seven days
        required: false
        type: string
        default: ''
      suite:
        description: 'Disposable hosted emulator suite'
        required: true
        default: qa-smoke
        type: choice
        options:
          - qa-smoke
          - qa-journeys
          - qa-16k-native
      run_monkey:
        description: Run the five bounded Monkey variants on the disposable QA emulator
        required: false
        type: boolean
        default: false
      monkey_only:
        description: Run only the complete Monkey matrix against a newly compiled exact-source QA APK
        required: false
        type: boolean
        default: false
      guest_api:
        description: Android API level for the disposable QA guest
        required: false
        type: choice
        default: '35'
        options:
          - '35'
          - '36'
      guest_pages:
        description: Memory page size for the disposable QA guest
        required: false
        type: choice
        default: '4k'
        options:
          - '4k'
          - '16k'

permissions:
  contents: read

concurrency:
  group: maestro-runtime-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'qa-smoke' }}-${{ inputs.guest_api || '35' }}-${{ inputs.guest_pages || '4k' }}
  cancel-in-progress: true

env:
  QA_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  QA_SUITE: ${{ inputs.suite || 'qa-smoke' }}
  QA_MONKEY: ${{ inputs.run_monkey && 'true' || 'false' }}
  QA_MONKEY_ONLY: ${{ inputs.monkey_only && 'true' || 'false' }}
  QA_GUEST_API: ${{ inputs.guest_api || '35' }}
  QA_GUEST_PAGES: ${{ inputs.guest_pages || '4k' }}

jobs:
  qa-apk-build:
    name: Exact-source local QA APK only
    if: ${{ inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      QA_CI_RUN: ${{ inputs.ci_run }}
      QA_APK_TARGET: ${{ inputs.apk_target_platform }}
      QA_STORAGE_CLEARANCE_SHA256: ${{ inputs.storage_clearance_sha256 }}
      QA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      QA_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Validate bounded build authorization and exact-source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ghostheart5/fantastic-guacamole
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$QA_SOURCE_SHA" = 03d67c52ebc8e57c1c11f25aa7e38f4014edd7a2
          test "$QA_CI_RUN" = 38646062537
          test "$QA_SUITE" = qa-smoke
          test "$QA_MONKEY" = false
          test "$QA_MONKEY_ONLY" = false
          case "$QA_APK_TARGET" in android-arm64|android-x64) ;; *) exit 1 ;; esac
          [[ "$QA_STORAGE_CLEARANCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          # This digest binds a separately reviewed account-capacity receipt.
          # Never dispatch before proving 200 MiB for seven days adds no charge.
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/qa-repository.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_CI_RUN" > "$RUNNER_TEMP/qa-ci-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          repo = json.loads((temp / 'qa-repository.json').read_text())
          ci = json.loads((temp / 'qa-ci-run.json').read_text())
          assert repo['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert repo['private'] is False and repo['visibility'] == 'public'
          assert ci['repository']['full_name'] == repo['full_name']
          assert ci['head_sha'] == os.environ['QA_SOURCE_SHA']
          assert str(ci['id']) == os.environ['QA_CI_RUN']
          assert ci['path'] == '.github/workflows/ci.yml'
          assert ci['event'] == 'workflow_dispatch'
          assert ci['status'] == 'completed' and ci['conclusion'] == 'success'
          PY

      - name: Checkout exact application source
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Record clean source, configuration and initial resources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git check-ignore -q test-results/qa-apk-build/provenance.json
          mkdir -p test-results/qa-apk-build
          python3 - <<'PY'
          import datetime, hashlib, json, os, shutil, subprocess
          from pathlib import Path
          def sha(path):
              with Path(path).open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          available = int(mem['MemAvailable'].split()[0]) * 1024
          free = shutil.disk_usage('.').free
          assert available >= 6 * 1024**3, 'Insufficient available physical RAM'
          assert free >= 8 * 1024**3, 'Insufficient free disk; no cleanup is authorized'
          config = 'tool/qa_defines.json'
          assert sha(config) == '66a668ee353d982f969891834991013cb6c69b79ec1477b996c2eacfee596bd4'
          assert sha('android/gradle.properties') == '4d44d934bbfa737db09a3513acdb455c73f7b14baf4c6cf4785b58257ceebbd5'
          ci = json.loads((Path(os.environ['RUNNER_TEMP']) / 'qa-ci-run.json').read_text())
          receipt = {
              'startedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'sourceSha': os.environ['QA_SOURCE_SHA'],
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflowSha': os.environ['QA_WORKFLOW_SHA'], 'workflowRef': os.environ['QA_WORKFLOW_REF'],
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ciRun': {'id': ci['id'], 'headSha': ci['head_sha'], 'conclusion': ci['conclusion']},
              'targetPlatform': os.environ['QA_APK_TARGET'], 'sourceInitiallyClean': True,
              'qaDefinesSha256': sha(config), 'lockfileSha256': sha('pubspec.lock'),
              'gradlePropertiesSha256': sha('android/gradle.properties'),
              'availablePhysicalBytes': available, 'freeDiskBytes': free,
              'storageClearanceSha256': os.environ['QA_STORAGE_CLEARANCE_SHA256'],
              'artifactLimitBytes': 199 * 1024**2, 'reservedStorageBytes': 200 * 1024**2,
              'retentionDays': 7,
              'boundary': 'Local QA debug artifact only; no device or app acceptance, cloud sync or Play billing proof.'
          }
          Path('test-results/qa-apk-build/provenance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Set up Java without a dependency cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter without a cache
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: false

      - name: Resolve the locked dependencies with local QA configuration
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cp .env.example .env
          flutter pub get --enforce-lockfile
          git diff --exit-code
          test -z "$(git status --porcelain)"
          flutter --version --machine > test-results/qa-apk-build/flutter-version.json
          java -version 2> test-results/qa-apk-build/java-version.txt

      - name: Compile only the bounded QA APK
        id: compile
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          assert int(mem['MemAvailable'].split()[0]) * 1024 >= 6 * 1024**3
          assert shutil.disk_usage('.').free >= 4 * 1024**3
          for process in Path('/proc').glob('[0-9]*/cmdline'):
              try:
                  name = Path(process.read_bytes().split(b'\0')[0].decode(errors='replace')).name
              except (OSError, ProcessLookupError):
                  continue
              assert name != 'emulator' and not name.startswith('qemu-system-'), 'Unexpected live emulator'
          PY
          flutter build apk --debug --target-platform="$QA_APK_TARGET" --dart-define-from-file=tool/qa_defines.json 2>&1 | tee test-results/qa-apk-build/build.log
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Stop only this runner's Gradle daemons
        if: ${{ always() && steps.compile.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          if [ -f android/gradlew ]; then (cd android && ./gradlew --stop); fi

      - name: Verify actual QA package, ABI, signing and upload bounds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          output = Path('test-results/qa-apk-build')
          apk = Path('build/app/outputs/flutter-apk/app-debug.apk')
          assert apk.is_file() and not apk.is_symlink()
          sdk = Path(os.environ['ANDROID_HOME'])
          tools = [p for p in (sdk / 'build-tools').iterdir() if (p / 'aapt2').is_file() and (p / 'apksigner').is_file()]
          assert tools, 'Android verification tools are missing'
          tools = max(tools, key=lambda p: tuple(map(int, re.findall(r'\d+', p.name))))
          badging = subprocess.check_output([str(tools / 'aapt2'), 'dump', 'badging', str(apk)], text=True)
          identity = re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging, re.M)
          assert identity and identity.groups() == ('com.ghostheart5.chronospark.qa', '2026101201', '4.2.4-qa')
          assert re.search(r'^application-debuggable\s*$', badging, re.M)
          assert re.search(r"^targetSdkVersion:'36'", badging, re.M)
          expected_abi = {'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64'}[os.environ['QA_APK_TARGET']]
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              entries = archive.namelist()
              assert f'lib/{expected_abi}/libflutter.so' in entries
              abis = sorted({name.split('/')[1] for name in entries if name.startswith('lib/') and name.endswith('.so')})
          signing = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          # Credential-free evidence must survive a failed identity guard.
          print(json.dumps({'apkSha256': digest, 'apkBytes': apk.stat().st_size,
                            'badging': badging, 'signature': signing}), flush=True)
          certs = sorted({c.lower() for c in re.findall(r'^(?:V\d+(?:\.\d+)? )?Signer(?: #\d+|:) certificate SHA-256 digest: ([a-fA-F0-9]{64})$', signing, re.M)})
          assert len(certs) == 1 and 'CN=Android Debug' in signing
          receipt = json.loads((output / 'provenance.json').read_text())
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == receipt['sourceSha']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          with Path('pubspec.lock').open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == receipt['lockfileSha256']
          receipt.update({
              'completedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'buildExitCode': 0, 'sourceFinallyClean': True,
              'command': ['flutter', 'build', 'apk', '--debug', '--target-platform=' + os.environ['QA_APK_TARGET'], '--dart-define-from-file=tool/qa_defines.json'],
              'apk': {'file': 'app-debug.apk', 'sha256': digest, 'bytes': apk.stat().st_size,
                      'applicationId': identity[1], 'versionCode': identity[2], 'versionName': identity[3],
                      'nativeAbis': abis, 'requiredAbi': expected_abi, 'signerSha256': certs[0].lower()},
              'androidBuildTools': tools.name
          })
          (output / 'provenance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (output / 'apk-badging.txt').write_text(badging)
          (output / 'apk-signature.txt').write_text(signing)
          (output / 'app-debug.apk.sha256').write_text(digest + '  app-debug.apk\n')
          shutil.copyfile(apk, output / 'app-debug.apk')
          allowed = {'provenance.json', 'flutter-version.json', 'java-version.txt', 'build.log', 'apk-badging.txt', 'apk-signature.txt', 'app-debug.apk.sha256', 'app-debug.apk'}
          assert {p.name for p in output.iterdir()} == allowed
          assert all(p.is_file() and not p.is_symlink() for p in output.iterdir())
          assert sum(p.stat().st_size for p in output.iterdir()) <= receipt['artifactLimitBytes'], 'Artifact exceeds reviewed no-charge capacity'
          PY

      - name: Retain the verified QA APK and credential-free build receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        timeout-minutes: 5
        with:
          name: axiomara-qa-apk-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.apk_target_platform }}
          path: test-results/qa-apk-build/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  runtime:
    name: Exact-build QA runtime
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Validate immutable QA inputs before checkout
        run: |
          set -euo pipefail
          [[ "$QA_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$QA_SUITE" in qa-smoke|qa-journeys|qa-16k-native) ;; *) exit 1 ;; esac
          case "$QA_GUEST_API" in 35|36) ;; *) exit 1 ;; esac
          case "$QA_GUEST_PAGES" in 4k|16k) ;; *) exit 1 ;; esac
          if [ "$QA_SUITE" = qa-16k-native ]; then
            test "$QA_GUEST_PAGES" = 16k
            test "$QA_MONKEY" = false
            test "$QA_MONKEY_ONLY" = false
          fi
          if [ "$QA_MONKEY_ONLY" = true ]; then test "$QA_MONKEY" = true; fi

      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          # Evidence must use the checked-out source's existing ignored root.
          # The canonical runner rejects untracked files as well as edits.
          git check-ignore -q test-results/maestro-prewarm/provenance.json
          git check-ignore -q test-results/monkey-seed-ci/probe.json
          git check-ignore -q test-results/monkey-ci/probe.json
          git check-ignore -q test-results/monkey-recovery-flows/probe.json
          mkdir -p test-results/maestro-prewarm
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('test-results/maestro-prewarm/provenance.json').write_text(json.dumps({
              'sourceSha': os.environ['QA_SOURCE_SHA'],
              'workflowToolingSha': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'suite': os.environ['QA_SUITE'],
              'monkeyOnly': os.environ['QA_MONKEY_ONLY'] == 'true',
              'guestApiRequested': os.environ['QA_GUEST_API'],
              'guestPagesRequested': os.environ['QA_GUEST_PAGES'],
              'boundary': 'QA source and workflow tooling have separate identities; not a signed release build.'
          }, indent=2) + '\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact Monkey tooling separately from application source
        if: inputs.run_monkey
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: test-results/monkey-tooling
          persist-credentials: false

      - name: Test source-bound Monkey seed preparation
        if: inputs.run_monkey
        run: |
          python3 -m unittest discover -s test-results/monkey-tooling/scripts -p test_prepare_monkey_seed_flows.py -v
          python3 -m unittest discover -s test-results/monkey-tooling/scripts -p test_prepare_qa_monkey_config.py -v

      - name: Checkout exact native smoke tooling separately from application source
        if: inputs.suite == 'qa-16k-native'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: test-results/native-tooling
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Validate isolated QA flow preparation
        run: python3 -m unittest discover -s scripts -p test_prepare_isolated_maestro_flows.py -v

      - name: Complete initial QA compilation before emulator startup
        timeout-minutes: 22
        run: |
          set -euo pipefail
          # Keep the first full Gradle compilation outside the live guest's
          # execution window. The canonical runner still performs its own build.
          python3 - <<'PY'
          from pathlib import Path
          for process in Path('/proc').glob('[0-9]*/cmdline'):
              try:
                  executable = process.read_bytes().split(b'\0')[0].decode(errors='replace')
              except (OSError, ProcessLookupError):
                  continue
              name = Path(executable).name
              if name == 'emulator' or name.startswith('qemu-system-'):
                  raise SystemExit('An emulator is already running before QA precompilation')
          PY
          flutter build apk --debug --target-platform=android-x64 --dart-define-from-file=tool/qa_defines.json 2>&1 | tee test-results/maestro-prewarm/build.log
          (cd android && ./gradlew --stop) 2>&1 | tee test-results/maestro-prewarm/gradle-stop.log
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > test-results/maestro-prewarm/precompiled-apk.sha256
          git diff --exit-code
          python3 - <<'PY'
          import datetime, hashlib, json, os, subprocess
          from pathlib import Path
          apk = Path('build/app/outputs/flutter-apk/app-debug.apk')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != os.environ['QA_SOURCE_SHA'] or not apk.is_file():
              raise SystemExit('Precompilation identity or APK is missing')
          with apk.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          Path('test-results/maestro-prewarm/completion.json').write_text(json.dumps({
              'completedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'sourceSha': source, 'precompiledApkSha256': digest,
              'buildExitCode': 0, 'gradleStopExitCode': 0,
              'noEmulatorObservedBeforeCompilation': True,
              'boundary': 'Exact-source precompilation; runtime receipts identify the installed APK and its separate test tooling.'
          }, indent=2) + '\n')
          PY
          test -z "$(git status --porcelain)"

      - name: Install checksum-verified Maestro CLI
        if: inputs.suite != 'qa-16k-native'
        timeout-minutes: 5
        env:
          MAESTRO_VERSION: '2.10.0'
          MAESTRO_ARCHIVE_SHA256: '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maestro.zip"
          install_root="$RUNNER_TEMP/maestro-cli"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_root"
          chmod +x "$install_root/maestro/bin/maestro"
          echo "$install_root/maestro/bin" >> "$GITHUB_PATH"
          "$install_root/maestro/bin/maestro" --version

      - name: Enable and verify hardware acceleration
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # This is the disposable hosted runner, not a developer workstation.
          # Grant only the current runner user access to the existing KVM device.
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Prepare bounded fresh-guest readiness and system diagnostics
        id: guest_image
        run: |
          set -euo pipefail
          python3 - <<'GUEST_IMAGE_SELECTION'
          import json, os, re
          from pathlib import Path
          suite = os.environ['QA_SUITE']
          api = os.environ['QA_GUEST_API']
          pages = os.environ['QA_GUEST_PAGES']
          assert api in ('35', '36') and pages in ('4k', '16k')
          assert suite in ('qa-smoke', 'qa-journeys', 'qa-16k-native')
          assert all(os.environ[key] in ('true', 'false') for key in ('QA_MONKEY', 'QA_MONKEY_ONLY'))
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['QA_SOURCE_SHA'])
          # The five app-owned API35 smoke flows use a normal AOSP image.
          # Google services/Play integration are not exercised by those flows.
          # Keep Google images for 16KB, other APIs, journeys and Monkey.
          app_smoke = (suite == 'qa-smoke' and api == '35' and
                       os.environ['QA_MONKEY'] == os.environ['QA_MONKEY_ONLY'] == 'false')
          target = 'google_apis_ps16k' if pages == '16k' else ('default' if app_smoke else 'google_apis')
          receipt = {'sourceSha': os.environ['QA_SOURCE_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                     'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'suite': suite,
                     'api': api, 'pages': pages, 'target': target,
                     'googleServicesIntegrationCovered': False}
          Path('test-results/maestro-prewarm/image-selection.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('target=' + target + '\n')
          GUEST_IMAGE_SELECTION
          cat > test-results/maestro-prewarm/record_guest_image.py <<'GUEST_IMAGE_RECORD'
          import hashlib, json, os
          from pathlib import Path
          root = Path('test-results/maestro-prewarm')
          selected = json.loads((root / 'image-selection.json').read_text())
          assert selected['sourceSha'] == os.environ['QA_SOURCE_SHA']
          assert selected['runId'] == os.environ['GITHUB_RUN_ID']
          assert selected['runAttempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          sdk = Path(os.environ['ANDROID_HOME']).resolve()
          config = Path(os.environ['ANDROID_AVD_HOME']) / 'test.avd/config.ini'
          pairs = [line.split('=', 1) for line in config.read_text().splitlines()
                   if line.strip() and not line.lstrip().startswith('#') and '=' in line]
          assert len([p for p in pairs if p[0].strip() == 'image.sysdir.1']) == 1
          values = {key.strip(): value.strip() for key, value in pairs}
          image = (sdk / values['image.sysdir.1']).resolve()
          expected = (sdk / 'system-images' / ('android-' + selected['api']) / selected['target'] / 'x86_64').resolve()
          assert image.is_relative_to(sdk) and image == expected
          properties = (image / 'source.properties').read_bytes()
          assert properties and b'Pkg.Revision' in properties
          receipt = {**selected, 'avdConfigSha256': hashlib.sha256(config.read_bytes()).hexdigest(),
                     'sdkImagePath': str(image), 'sourcePropertiesSha256': hashlib.sha256(properties).hexdigest(),
                     'sourceProperties': properties.decode('utf-8'), 'actualAvdImageMatched': True}
          (root / 'guest-image.json').write_text(json.dumps(receipt, indent=2) + '\n')
          GUEST_IMAGE_RECORD
          cat > test-results/maestro-prewarm/prepare_guest.py <<'PY'
          import json, os, re, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from hosted_guest_anr import classify_anr
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.name == 'posix'
          root = Path('test-results/maestro-prewarm')
          adb = ['adb', '-s', 'emulator-5554']
          def shell(*args):
              return subprocess.check_output(adb + ['shell', *args], timeout=20).decode('utf-8').strip()
          assert shell('getprop', 'ro.kernel.qemu') == '1', 'Only an owned hosted emulator is allowed'
          assert shell('am', 'get-current-user') == '0'
          page_size = int(shell('getconf', 'PAGE_SIZE'))
          expected_page_size = 16384 if os.environ['QA_GUEST_PAGES'] == '16k' else 4096
          assert page_size == expected_page_size, f'Unexpected guest page size: {page_size}'
          app_package = 'com.ghostheart5.chronospark.qa'
          receipt = {'passed': False, 'samples': [], 'applicationTestsExecuted': 0,
                     'pageSizeBytes': page_size, 'androidApi': shell('getprop', 'ro.build.version.sdk'),
                     'hostCpuCount': os.cpu_count(), 'guestCpuPresent': shell('cat', '/sys/devices/system/cpu/present')}
          try:
              receipt['resolvedHomeBeforeSettling'] = shell('cmd', 'package', 'resolve-activity', '--brief',
                  '-a', 'android.intent.action.MAIN', '-c', 'android.intent.category.HOME')
              def canonical(component):
                  package, activity = component.split('/')
                  return package + '/' + (package + activity if activity.startswith('.') else activity)
              stable_home_samples = 0
              previous_home = None
              # Boot completion precedes first-boot package and launcher work.
              # Require actual HOME focus during the bounded settling window,
              # not just boot/property readiness. Never dismiss or retry ANRs.
              for index in range(7):
                  if index:
                      time.sleep(10)
                  assert shell('getprop', 'sys.boot_completed') == '1'
                  assert shell('pm', 'path', 'android').startswith('package:')
                  window = shell('dumpsys', 'window', 'windows')
                  activities = shell('dumpsys', 'activity', 'activities')
                  last_anr = shell('dumpsys', 'activity', 'lastanr')
                  (root / 'prepared-window.txt').write_text(window)
                  (root / 'prepared-activities.txt').write_text(activities)
                  (root / 'prepared-lastanr.txt').write_text(last_anr)
                  (root / f'sample-{index}-window.txt').write_text(window)
                  (root / f'sample-{index}-activities.txt').write_text(activities)
                  (root / f'sample-{index}-lastanr.txt').write_text(last_anr)
                  anr_events = shell('logcat', '-d', '-b', 'events', '-v', 'threadtime')
                  (root / f'sample-{index}-anr-events.txt').write_text(anr_events)
                  try:
                      anr_state = classify_anr(last_anr, anr_events, app_package)
                  except ValueError as error:
                      receipt['anrFailure'] = str(error)
                      raise AssertionError('Unable to determine fresh guest ANR state') from error
                  receipt['lastAnrState'] = anr_state
                  assert not anr_state['appAnrObserved'], 'Fresh guest reported an ANR in the app before app tests'
                  assert not re.search(r'Application (?:Error|Not Responding)|isn.t responding', window, re.I)
                  # The early resolver can name Setup while HOME has moved to the
                  # launcher. Read the current visible user-0 HOME task each sample.
                  homes = set(re.findall(r'^\s*\* Task\{[^\n]*\btype=home\b[^\n]*\bI=([\w.]+/[\w.$]+)[^\n]*\bU=0\b[^\n]*\bvisible=true\b', activities, re.M))
                  home = next(iter(homes)) if len(homes) == 1 else None
                  current_focus = {canonical(c) for c in re.findall(r'^\s*mCurrentFocus=Window\{[^\n}]*\bu0\s+([\w.]+/[\w.$]+)', activities, re.M)}
                  current_resumed = {canonical(c) for c in re.findall(r'^\s*(?:topResumedActivity=|ResumedActivity:)\s*ActivityRecord\{[^\n}]*\bu0\s+([\w.]+/[\w.$]+)', activities, re.M)}
                  focused = home is not None and current_focus == {canonical(home)}
                  resumed = home is not None and current_resumed == {canonical(home)}
                  setup_activity = home is not None and home.startswith('com.google.android.googlesdksetup/')
                  stable_home_samples = (stable_home_samples + 1 if home == previous_home else 1) if focused and resumed and not setup_activity else 0
                  previous_home = home
                  receipt['homeActivity'] = home
                  receipt['samples'].append({'index': index, 'monotonic': time.monotonic(),
                      'homeActivity': home, 'setupActivity': setup_activity, 'focusedActivities': sorted(current_focus), 'resumedActivities': sorted(current_resumed),
                      'anrState': anr_state,
                      'homeFocused': focused, 'homeResumed': resumed, 'stableHomeSamples': stable_home_samples,
                      'guestMemory': shell('cat', '/proc/meminfo'),
                      'hostMemory': Path('/proc/meminfo').read_text(),
                      'hostLoad': Path('/proc/loadavg').read_text().strip()})
              assert stable_home_samples >= 3, 'Fresh guest HOME never reached stable focused/resumed readiness'
              receipt['passed'] = True
          finally:
              (root / 'guest-readiness.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          cat > test-results/maestro-prewarm/run-suite.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          capture_system() {
            result=$?
            trap - EXIT
            timeout 30s adb -s emulator-5554 logcat -d -b all -v threadtime > test-results/maestro-prewarm/system-logcat.txt 2>&1 || result=1
            timeout 30s adb -s emulator-5554 shell dumpsys activity lastanr > test-results/maestro-prewarm/final-lastanr.txt 2>&1 || result=1
            timeout 30s adb -s emulator-5554 shell dumpsys window windows > test-results/maestro-prewarm/final-window.txt 2>&1 || result=1
            python3 - test-results/maestro-prewarm/final-lastanr.txt <<'PY' || result=1
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from hosted_guest_anr import classify_anr
          last_anr = Path(sys.argv[1]).read_text(errors='replace')
          app_package = 'com.ghostheart5.chronospark.qa'
          root = Path('test-results/maestro-prewarm')
          try:
              state = classify_anr(last_anr, (root / 'system-logcat.txt').read_text(errors='replace'), app_package)
          except ValueError as error:
              (root / 'final-anr-state.json').write_text(json.dumps({'determined': False, 'diagnostic': str(error)}) + '\n')
              raise SystemExit('Unable to determine final guest ANR state') from error
          (root / 'final-anr-state.json').write_text(json.dumps(state, indent=2) + '\n')
          if state['appAnrObserved']:
              raise SystemExit('Final guest reported an ANR in the app')
          PY
            exit "$result"
          }
          trap capture_system EXIT
          test -s test-results/maestro-prewarm/runner-input-order.json
          test -s test-results/maestro-prewarm/guest-image.json
          python3 test-results/maestro-prewarm/prepare_guest.py
          if [ "$QA_SUITE" = qa-16k-native ]; then
            python3 test-results/native-tooling/scripts/run_16k_adb_smoke.py
          elif [ "$QA_MONKEY_ONLY" != true ]; then
            pwsh -NoProfile -File ./scripts/run_maestro_android_evidence.ps1 -Suite "$QA_SUITE" -ExecutionTimeoutSeconds "$QA_TIMEOUT_SECONDS" -BuildProfile qa -DeviceSerial emulator-5554 -ExpectedCommit "$QA_SOURCE_SHA" -ArtifactsRoot artifacts/maestro-ci
          else
            # Recreate the same final data lifecycle as the full journey suite.
            # The first flow clears state, so earlier journeys do not contribute
            # additional records to the original Monkey starting state.
            python3 test-results/monkey-tooling/scripts/prepare_monkey_seed_flows.py "$GITHUB_WORKSPACE" "$QA_SOURCE_SHA" "$GITHUB_WORKSPACE/test-results/monkey-recovery-flows"
            for flow in priority8-learned-lifecycle priority8-learned-lifecycle-readback; do
              pwsh -NoProfile -File ./scripts/run_maestro_android_evidence.ps1 -Suite custom -Flow "test-results/monkey-recovery-flows/.maestro/flows/$flow.yaml" -ExecutionTimeoutSeconds 900 -BuildProfile qa -DeviceSerial emulator-5554 -ExpectedCommit "$QA_SOURCE_SHA" -SkipBuild -ApkPath build/app/outputs/flutter-apk/app-debug.apk -ExpectedApkSha256 "$(sha256sum build/app/outputs/flutter-apk/app-debug.apk | cut -d ' ' -f1)" -ArtifactsRoot test-results/monkey-seed-ci
            done
          fi
          if [ "$QA_MONKEY" = true ]; then
            seed_mode=()
            if [ "$QA_MONKEY_ONLY" = true ]; then seed_mode=(--seed-only); fi
            python3 test-results/monkey-tooling/scripts/prepare_qa_monkey_config.py --root "$GITHUB_WORKSPACE" --source "$QA_SOURCE_SHA" --target "$GITHUB_WORKSPACE/test-results/monkey-qa-config" --apk "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-debug.apk" --sdk "$ANDROID_HOME" "${seed_mode[@]}"
            pwsh -NoProfile -File ./test-results/monkey-tooling/scripts/run_android_monkey_matrix.ps1 -RepositoryRoot "$GITHUB_WORKSPACE" -Config "$GITHUB_WORKSPACE/test-results/monkey-qa-config/config.json" -DeviceSerial emulator-5554 -ExpectedAndroidApi "$QA_GUEST_API" -AllowConnectedDevice -ApkPath build/app/outputs/flutter-apk/app-debug.apk -ExpectedApkSha256 "$(sha256sum build/app/outputs/flutter-apk/app-debug.apk | cut -d ' ' -f1)" -ArtifactsRoot test-results/monkey-ci
          fi
          SH

      - name: Checkout pinned emulator runner for passive startup
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: test-results/hosted-emulator-runner
          persist-credentials: false

      - name: Verify exact runner and remove only unsolicited startup input
        run: python3 scripts/prepare_hosted_emulator_runner.py

      - name: Build, install, and execute exact-source QA suite
        timeout-minutes: 70
        env:
          # The expanded Creator journey alone takes about eight minutes on the
          # two-core hosted emulator. Keep a bounded budget with enough room for
          # all five smoke flows or all eleven journey flows plus evidence flush.
          QA_TIMEOUT_SECONDS: ${{ inputs.suite == 'qa-journeys' && '3600' || '1800' }}
        # The verified local copy differs by one startup MENU injection only.
        # Preserve SDK/AVD setup and let the existing passive HOME guard decide.
        uses: ./test-results/hosted-emulator-runner
        with:
          api-level: ${{ inputs.guest_api || '35' }}
          target: ${{ steps.guest_image.outputs.target }}
          arch: x86_64
          profile: pixel_6
          # Public ubuntu-24.04 runners provide four vCPUs. Use them during
          # first-boot launcher initialization instead of constraining the guest
          # to two. Preserve memory, hardware acceleration and all error guards.
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-port: 5554
          # Never silently fall back to software emulation: it caused system
          # ANRs and killed the Maestro driver before any flow could execute.
          disable-linux-hw-accel: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check && python3 test-results/maestro-prewarm/record_guest_image.py'
          disable-animations: true
          disable-spellchecker: true
          script: |
            bash test-results/maestro-prewarm/run-suite.sh

      - name: Verify source-bound Maestro evidence
        if: always() && !inputs.monkey_only && inputs.suite != 'qa-16k-native'
        env:
          EXPECTED_COMMIT: ${{ inputs.source_sha || github.sha }}
          EXPECTED_SUITE: ${{ inputs.suite || 'qa-smoke' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifests = list(Path('artifacts/maestro-ci').glob('*/manifest.json'))
          if len(manifests) != 1:
              raise SystemExit(f'::error::Expected one Maestro manifest, found {len(manifests)}.')
          manifest = json.loads(manifests[0].read_text(encoding='utf-8-sig'))
          if manifest.get('git', {}).get('commit') != os.environ['EXPECTED_COMMIT']:
              raise SystemExit('::error::Maestro manifest does not match the workflow commit.')
          if manifest.get('git', {}).get('dirty'):
              raise SystemExit('::error::Maestro evidence was produced from a dirty checkout.')
          if manifest.get('status') != 'passed':
              raise SystemExit('::error::Maestro evidence manifest did not pass.')
          if manifest.get('apk', {}).get('builtFromCheckout') is not True:
              raise SystemExit('::error::Hosted Maestro evidence must use an APK built from the checkout.')
          flows = manifest.get('flows')
          if not isinstance(flows, list) or not flows:
              raise SystemExit('::error::Maestro evidence contains no selected flows.')
          expected_count = {'qa-smoke': 5, 'qa-journeys': 11}[os.environ['EXPECTED_SUITE']]
          if len(flows) != expected_count:
              raise SystemExit('::error::Maestro selected flow count does not match the requested suite.')
          junit = manifest.get('junit', {})
          if not isinstance(junit.get('testCases'), int) or junit['testCases'] <= 0:
              raise SystemExit('::error::Maestro JUnit evidence contains zero tests.')
          if junit['testCases'] != len(flows) or junit.get('testCaseCountMatchesFlows') is not True:
              raise SystemExit('::error::Maestro JUnit testcase count does not match selected flows.')
          logcat = manifest.get('logcatCapture', {})
          if (logcat.get('status') != 'passed' or logcat.get('aliveThroughRun') is not True or
                  not isinstance(logcat.get('outputBytes'), int) or logcat['outputBytes'] <= 0 or
                  logcat.get('stderrBytes') != 0):
              raise SystemExit('::error::Maestro Logcat capture evidence is incomplete.')
          if (junit.get('failures') != 0 or junit.get('errors') != 0 or
                  junit.get('skipped') != 0 or junit.get('status') != 'passed'):
              raise SystemExit('::error::Maestro JUnit evidence is not a complete passing run.')
          PY

      - name: Verify source-bound native 16 KB launch evidence
        if: always() && inputs.suite == 'qa-16k-native'
        env:
          EXPECTED_COMMIT: ${{ inputs.source_sha || github.sha }}
          EXPECTED_TOOLING: ${{ github.sha }}
          EXPECTED_API: ${{ inputs.guest_api || '35' }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, re
          from pathlib import Path
          receipt_path = Path('test-results/native-16k-ci/manifest.json')
          if not receipt_path.is_file():
              raise SystemExit('::error::Native 16 KB manifest is missing.')
          receipt = json.loads(receipt_path.read_text())
          script = Path('test-results/native-tooling/scripts/run_16k_adb_smoke.py')
          compilation = json.loads(Path('test-results/maestro-prewarm/completion.json').read_text())
          readiness = json.loads(Path('test-results/maestro-prewarm/guest-readiness.json').read_text())
          assert receipt['status'] == 'passed'
          assert receipt['sourceSha'] == os.environ['EXPECTED_COMMIT']
          assert receipt['workflowToolingSha'] == os.environ['EXPECTED_TOOLING']
          assert receipt['toolScriptSha256'].lower() == hashlib.sha256(script.read_bytes()).hexdigest()
          spec = importlib.util.spec_from_file_location('native_smoke', script)
          native_smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(native_smoke)
          assert receipt['package'] == native_smoke.PACKAGE == 'com.ghostheart5.chronospark.qa'
          assert receipt['apkSha256'].lower() == compilation['precompiledApkSha256'].lower()
          pubspec_version = re.search(r'(?m)^version:\s*\d+\.\d+\.\d+\+(\d+)\s*$',
                                       Path('pubspec.yaml').read_text())
          android_version = re.search(r'(?m)^CHRONOSPARK_VERSION_CODE=(\d+)\s*$',
                                       Path('android/gradle.properties').read_text())
          assert pubspec_version and android_version
          assert receipt['installedVersionCode'] == receipt['sourceVersionCode'] == pubspec_version.group(1) == android_version.group(1)
          assert receipt['androidApi'] == readiness['androidApi'] == os.environ['EXPECTED_API']
          assert receipt['pageSize'] == 16384 and readiness['pageSizeBytes'] == 16384
          assert receipt['serial'] == 'emulator-5554'
          assert len(receipt['launches']) == 5 and receipt['appFatalCount'] == 0
          for launch in receipt['launches']:
              image = Path(f"test-results/native-16k-ci/launch-{launch['number']}.png")
              assert hashlib.sha256(image.read_bytes()).hexdigest() == launch['screenshotSha256']
              assert native_smoke.is_chronospark_activity(launch['focus'])
              assert native_smoke.is_chronospark_activity(launch['resumedActivity'])
              assert launch['uiReadyMarker'] in {'CONTINUE TO LOGIN', 'START LOGIN',
                                                 'SKIP FOR NOW', 'TESTER ACCESS',
                                                 'ENTER SYSTEM', 'NEXUS'}
              assert launch['uiNodeCount'] > 0 and launch['uiWaitSeconds'] >= 5
              assert len(launch['uiTreeSha256']) == 64
          PY

      - name: Verify optional Monkey evidence
        if: always() && inputs.run_monkey
        env:
          EXPECTED_COMMIT: ${{ inputs.source_sha || github.sha }}
          EXPECTED_TOOLING: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifests = list(Path('test-results/monkey-ci').glob('*/manifest.json'))
          assert len(manifests) == 1, 'Expected one Monkey matrix manifest'
          m = json.loads(manifests[0].read_text(encoding='utf-8-sig'))
          assert m['git']['commit'] == os.environ['EXPECTED_COMMIT'] and not m['git']['dirty']
          assert m['runner']['commit'] == os.environ['EXPECTED_TOOLING']
          import hashlib
          runner = Path('test-results/monkey-tooling/scripts/run_android_monkey_matrix.ps1')
          assert m['runner']['scriptSha256'].lower() == hashlib.sha256(runner.read_bytes()).hexdigest()
          compilation = json.loads(Path('test-results/maestro-prewarm/completion.json').read_text())
          assert compilation['sourceSha'] == os.environ['EXPECTED_COMMIT']
          assert compilation['precompiledApkSha256'].lower() == m['apk']['sha256'].lower()
          if os.environ['QA_MONKEY_ONLY'] == 'true':
              flow_root = Path('test-results/monkey-recovery-flows')
              flow_receipt = json.loads((flow_root / 'provenance.json').read_text())
              assert flow_receipt['sourceSha'] == os.environ['EXPECTED_COMMIT']
              import subprocess
              subprocess.run(['python3', 'test-results/monkey-tooling/scripts/prepare_monkey_seed_flows.py',
                              '--verify', '.', os.environ['EXPECTED_COMMIT'], str(flow_root)], check=True)
              seeds = list(Path('test-results/monkey-seed-ci').glob('*/manifest.json'))
              assert len(seeds) == 2
              names = set()
              for seed_path in seeds:
                  seed = json.loads(seed_path.read_text(encoding='utf-8-sig'))
                  assert seed['status'] == 'passed' and seed['git']['commit'] == os.environ['EXPECTED_COMMIT']
                  assert not seed['git']['dirty'] and seed['apk']['externalHashVerified']
                  assert seed['apk']['sha256'].lower() == m['apk']['sha256'].lower()
                  assert seed['junit']['testCases'] == 1 and seed['junit']['failures'] == seed['junit']['errors'] == seed['junit']['skipped'] == 0
                  assert seed['fatalMarkerCount'] == 0 and seed['logcatCapture']['aliveThroughRun']
                  names.update(seed['flows'])
              assert names == {'priority8-learned-lifecycle.yaml', 'priority8-learned-lifecycle-readback.yaml'}
          config_helper = Path('test-results/monkey-tooling/scripts/prepare_qa_monkey_config.py')
          import subprocess
          config_command = ['python3', str(config_helper), '--verify', '--root', '.', '--source', os.environ['EXPECTED_COMMIT'], '--target', 'test-results/monkey-qa-config', '--apk', 'build/app/outputs/flutter-apk/app-debug.apk']
          if os.environ['QA_MONKEY_ONLY'] == 'true':
              config_command.append('--seed-only')
          subprocess.run(config_command, check=True)
          assert m['package'] == 'com.ghostheart5.chronospark.qa'
          config_receipt = json.loads(Path('test-results/monkey-qa-config/provenance.json').read_text())
          assert config_receipt['apkSha256'].lower() == m['apk']['sha256'].lower()
          assert config_receipt['sourceSha'] == os.environ['EXPECTED_COMMIT']
          assert m['device']['serial'] == 'emulator-5554'
          assert m['status'] == 'passed' and m['requestedVariantCount'] == m['completedVariantCount'] == 5
          assert len(m['results']) == 5
          for result in m['results']:
              assert result['relaunchLogcatCollected'] and result['fatalMarkerCount'] == 0
              log_path = Path(result['relaunchLogcatPath'])
              assert hashlib.sha256(log_path.read_bytes()).hexdigest() == result['relaunchLogcatSha256']
          PY

      - name: Upload complete Maestro evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-maestro-${{ inputs.source_sha || github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          # Recovery copies are tracked-source .maestro files, not credentials.
          include-hidden-files: true
          path: |
            artifacts/maestro-ci/**
            test-results/native-16k-ci/**
            test-results/maestro-prewarm/**
            test-results/monkey-ci/**
            test-results/monkey-seed-ci/**
            test-results/monkey-recovery-flows/**
            test-results/monkey-qa-config/**
