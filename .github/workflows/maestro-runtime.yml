name: ChronoSpark Repair Android Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronospark-authenticated-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Repaired dialogs and runtime gates
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: app
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2048m'
    steps:
      - name: Checkout frozen application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout campaign controls separately
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: .github/campaigns/20260906-repair
          persist-credentials: false

      - name: Verify frozen source and clean checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          free -m
          df -h .

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Install checksum-verified Maestro CLI
        timeout-minutes: 5
        env:
          MAESTRO_VERSION: '2.10.0'
          MAESTRO_ARCHIVE_SHA256: '29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maestro.zip"
          install_root="$RUNNER_TEMP/maestro-cli"
          curl --fail --location --silent --show-error \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$archive"
          echo "${MAESTRO_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$install_root"
          chmod +x "$install_root/maestro/bin/maestro"
          echo "$install_root/maestro/bin" >> "$GITHUB_PATH"
          "$install_root/maestro/bin/maestro" --version

      - name: Build QA APK from the repaired source
        timeout-minutes: 30
        run: flutter build apk --debug --no-pub --dart-define-from-file=tool/qa_defines.json

      - name: Enable and verify hardware acceleration
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # This is the disposable hosted runner, not a developer workstation.
          # Grant only the current runner user access to the existing KVM device.
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Execute authenticated stress and complete journeys
        timeout-minutes: 125
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-port: 5554
          disable-linux-hw-accel: false
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          disable-animations: true
          disable-spellchecker: true
          script: >-
            pwsh -NoProfile -File "$GITHUB_WORKSPACE/harness/.github/campaigns/20260906-repair/run_repair_campaign.ps1"
            -SourceRoot "$GITHUB_WORKSPACE/app"

      - name: Verify complete source and APK bound evidence
        if: always()
        run: |
          python3 "$GITHUB_WORKSPACE/harness/.github/campaigns/20260906-repair/verify_repair_campaign.py" test-results/hosted-campaign

      - name: Upload complete campaign evidence and exact QA APK
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-repair-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
          path: app/test-results/hosted-campaign/**
