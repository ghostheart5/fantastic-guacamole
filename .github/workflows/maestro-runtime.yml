# UNEXECUTED PROPOSAL ONLY. Owner choice/clearance/publication required.
name: Bounded landscape fixture CI only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact reviewed base source; exact combined overlay plus narrow correction provenance'
        type: string
        required: true
        default: '5bcdef1b47ca265a2e3069d7702603db26afa85f'
      workflow_sha:
        description: 'Exact owner-approved newly published workflow/payload commit'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: axiomara-landscape-fixture-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: One bounded strict landscape fixture CI job
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_SOURCE_SHA: 5bcdef1b47ca265a2e3069d7702603db26afa85f
      WORKFLOW_SHA_INPUT: ${{ inputs.workflow_sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      EVENT_NAME: ${{ github.event_name }}
      REPOSITORY_NAME: ${{ github.repository }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      MANIFEST_SHA256: 48640d3bbbc90cd0fb05cadbeea8a211fa899151700941603128aa46305613f2
      HELPER_SHA256: 0399de13adad24918f7344265f0701bfb30b479e2a869abfae79b9410ccfe41a
      PATCH_SHA256: 43ca8098281ee79eb1ae4e00b418e89c210948cf81ff8ee98aa428c65a135409
      CORRECTION_PATCH_SHA256: e752f48070bbc3a486c6b3c9f0243ec4823178c65c70fecf4c0ae3fb2730cd00
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      GIT_TERMINAL_PROMPT: '0'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Validate exact manual public scope and fresh resource floor before checkout
        id: scope
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY_NAME" = ghostheart5/fantastic-guacamole
          test "$REPOSITORY_PRIVATE" = false
          test "$ACTOR" = ghostheart5
          test "$TRIGGERING_ACTOR" = ghostheart5
          test "$GITHUB_REF" = refs/heads/test/axiomara-landscape-fixture-ci-20261016
          test "$WORKFLOW_REF" = ghostheart5/fantastic-guacamole/.github/workflows/maestro-runtime.yml@refs/heads/test/axiomara-landscape-fixture-ci-20261016
          test "$RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$WORKFLOW_SHA_INPUT" = "$WORKFLOW_SHA"
          test "$WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" != "$WORKFLOW_SHA"
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          available = int(next(x.split()[1] for x in Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))) * 1024
          free = shutil.disk_usage('.').free
          assert available >= 6 * 1024**3
          assert free >= 8 * 1024**3
          print(json.dumps({'availableRamBytes': available, 'freeDiskBytes': free, 'proposedCostScope': 'public standard Ubuntu only; no paid runner/service'}))
          PY

      - name: Checkout exact published app source into source
        id: source_checkout
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact workflow commit and its frozen parent into workflow-payload
        id: payload_checkout
        timeout-minutes: 5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.workflow_sha }}
          path: workflow-payload
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable payload then apply and bind the exact unstaged overlay
        id: overlay
        timeout-minutes: 5
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/workflow-payload/ci/landscape-fixture"
          printf '%s  %s\n' "$HELPER_SHA256" "$payload/verify_candidate.py" | sha256sum --check --strict
          printf '%s  %s\n' "$MANIFEST_SHA256" "$payload/candidate-manifest.json" | sha256sum --check --strict
          printf '%s  %s\n' "$PATCH_SHA256" "$payload/FULL_CANDIDATE_FINAL.patch" | sha256sum --check --strict
          printf '%s  %s\n' "$CORRECTION_PATCH_SHA256" "$payload/LANDSCAPE_FIXTURE_CORRECTION.patch" | sha256sum --check --strict
          python3 "$payload/verify_candidate.py" apply \
            --source "$GITHUB_WORKSPACE/source" \
            --payload "$GITHUB_WORKSPACE/workflow-payload" \
            --evidence "$RUNNER_TEMP/landscape-fixture-ci" --workflow-sha "$WORKFLOW_SHA"

      - name: Set up existing pinned Flutter with caches disabled
        id: flutter
        timeout-minutes: 5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: false

      - name: Use only the credential-free example and locked dependencies
        id: deps
        timeout-minutes: 5
        working-directory: source
        run: |
          set -euo pipefail
          git check-ignore -q .env
          test ! -e .env
          cp .env.example .env
          timeout --signal=TERM --kill-after=10s 240s flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          timeout --signal=TERM --kill-after=10s 240s flutter --version --machine > "$RUNNER_TEMP/landscape-fixture-ci/flutter-version.json"
          cat "$RUNNER_TEMP/landscape-fixture-ci/flutter-version.json"
          python3 - "$RUNNER_TEMP/landscape-fixture-ci/flutter-version.json" <<'PY'
          import json, sys
          version = json.load(open(sys.argv[1], encoding='utf-8'))
          assert version['frameworkVersion'] == '3.44.6'
          assert version['dartSdkVersion'].split()[0] == '3.12.2'
          PY

      - name: Check formatting of all twenty affected Dart files
        id: format
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        run: |
          timeout --signal=TERM --kill-after=10s 240s dart format --output=none --set-exit-if-changed \
            lib/features/onboarding/ui/onboarding_screen.dart \
            lib/state/controllers/profile_controller.dart \
            lib/tutorial/adaptive_guide_overlay.dart \
            lib/ui/system/temporal_glass.dart \
            test/ui/system/temporal_screen_header_semantics_test.dart \
            test/state/controllers/profile_local_name_seed_test.dart \
            test/onboarding/onboarding_welcome_destination_test.dart \
            test/onboarding/onboarding_screen_test.dart \
            test/app/onboarding_return_to_router_test.dart \
            patrol_test/current_navigation_support.dart \
            patrol_test/tutorial_planner_journey_test.dart \
            integration_test/auth_flow_integration_test.dart \
            lib/features/auth/screens/auth_gate.dart \
            lib/features/auth/ui/local_profile_screen.dart \
            test/features/auth/local_profile_first_run_back_test.dart \
            test/acceptance/local_profile_back_router_local_probe.dart \
            lib/app/navigation_shell_ui.dart \
            lib/features/tasks/widgets/task_edit_dialog.dart \
            test/app/navigation_shell_landscape_layout_test.dart \
            test/features/tasks/task_edit_dialog_keyboard_layout_test.dart

      - name: Full analysis with fatal-info policy
        id: analysis
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        run: timeout --signal=TERM --kill-after=10s 240s flutter analyze --no-pub --fatal-infos

      - name: Retain maintained static Maestro validation without a device
        id: maestro
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        run: timeout --signal=TERM --kill-after=10s 240s dart run tool/validate_maestro_flows.dart

      - name: Retain all prior cloud fixtures plus Back and both S2 regressions
        id: cloud
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        run: |
          dart run tool/run_flutter_tests.dart \
            --report "$RUNNER_TEMP/landscape-fixture-ci/cloud.jsonl" \
            --manifest "$RUNNER_TEMP/landscape-fixture-ci/cloud-manifest.json" \
            --timeout-seconds 240 --allowed-skips 0 -- \
            test/onboarding/onboarding_welcome_destination_test.dart \
            test/onboarding/onboarding_screen_test.dart \
            test/app/onboarding_return_to_router_test.dart \
            test/tutorial/first_run_guide_dead_end_test.dart \
            test/ui/system/temporal_screen_header_semantics_test.dart \
            test/state/controllers/profile_local_name_seed_test.dart \
            test/state/controllers/profile_account_scope_test.dart \
            test/state/controllers/profile_persistence_race_test.dart \
            test/data/services/local_profile_auth_service_test.dart \
            test/features/onboarding/onboarding_first_value_accessibility_test.dart \
            test/features/onboarding/onboarding_keyboard_test.dart \
            test/features/auth/local_profile_first_run_back_test.dart \
            test/app/navigation_shell_landscape_layout_test.dart \
            test/features/tasks/task_edit_dialog_keyboard_layout_test.dart \
            --no-pub --concurrency=1 --reporter expanded

      - name: Retain all prior local fixtures plus protected Back probe and both S2 regressions
        id: local
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        run: |
          dart run tool/run_flutter_tests.dart \
            --report "$RUNNER_TEMP/landscape-fixture-ci/local-qa.jsonl" \
            --manifest "$RUNNER_TEMP/landscape-fixture-ci/local-qa-manifest.json" \
            --timeout-seconds 240 --allowed-skips 0 -- \
            test/onboarding/onboarding_welcome_destination_test.dart \
            test/onboarding/onboarding_screen_test.dart \
            test/app/onboarding_return_to_router_test.dart \
            test/tutorial/first_run_guide_dead_end_test.dart \
            test/ui/system/temporal_screen_header_semantics_test.dart \
            test/state/controllers/profile_local_name_seed_test.dart \
            test/state/controllers/profile_account_scope_test.dart \
            test/state/controllers/profile_persistence_race_test.dart \
            test/data/services/local_profile_auth_service_test.dart \
            test/features/onboarding/onboarding_first_value_accessibility_test.dart \
            test/features/onboarding/onboarding_keyboard_test.dart \
            test/features/auth/local_profile_first_run_back_test.dart \
            test/acceptance/local_profile_back_router_local_probe.dart \
            test/app/navigation_shell_landscape_layout_test.dart \
            test/features/tasks/task_edit_dialog_keyboard_layout_test.dart \
            --no-pub --concurrency=1 --reporter expanded \
            --dart-define-from-file=tool/qa_defines.json

      - name: Log all four raw reports then require strict fixture outcomes and source identity
        id: final_gate
        if: ${{ always() && steps.overlay.outcome == 'success' }}
        timeout-minutes: 5
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
          MAESTRO_OUTCOME: ${{ steps.maestro.outcome }}
          CLOUD_OUTCOME: ${{ steps.cloud.outcome }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/workflow-payload/ci/landscape-fixture/verify_candidate.py" final \
            --source "$GITHUB_WORKSPACE/source" \
            --payload "$GITHUB_WORKSPACE/workflow-payload" \
            --evidence "$RUNNER_TEMP/landscape-fixture-ci" --workflow-sha "$WORKFLOW_SHA"

