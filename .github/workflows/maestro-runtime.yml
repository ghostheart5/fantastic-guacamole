name: Listing media capture (isolated local QA)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full immutable application source SHA to render
        required: true
        type: string
      locale:
        description: Language to capture
        type: choice
        required: true
        default: both
        options:
          - both
          - en-US
          - es-US

permissions:
  contents: read

concurrency:
  group: listing-media-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Real UI ${{ matrix.locale }} phone and tablets
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        locale: ${{ fromJSON(inputs.locale == 'en-US' && '["en-US"]' || inputs.locale == 'es-US' && '["es-US"]' || '["en-US","es-US"]') }}
    env:
      QA_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate public disposable hosted boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = ghostheart5/fantastic-guacamole
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          [[ "$QA_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          mem = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          assert int(mem['MemAvailable'].split()[0]) * 1024 >= 6 * 1024**3
          assert shutil.disk_usage('.').free >= 8 * 1024**3
          PY

      - name: Checkout immutable application
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require clean main-ancestor source and local QA flags
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$QA_SOURCE_SHA" origin/main
          git check-ignore -q test-results/listing-media/probe
          python3 - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('tool/qa_defines.json').read_text())
          assert q['CHRONOSPARK_APP_FLAVOR'] == 'qa'
          assert q['CHRONOSPARK_BACKEND_MODE'] == 'local'
          for key in ['CHRONOSPARK_ENABLE_MOCK_LOGIN','CHRONOSPARK_ENABLE_MOCK_MODE',
                      'CHRONOSPARK_ENABLE_TESTER_FULL_ACCESS','CHRONOSPARK_ENABLE_CLOUD_SYNC',
                      'CHRONOSPARK_ENABLE_ANALYTICS','CHRONOSPARK_ENABLE_CRASH_REPORTING',
                      'CHRONOSPARK_ENABLE_RUNTIME_FEATURE_FLAGS']:
              assert q[key] is False, key
          assert q.get('CHRONOSPARK_PUBLIC_RELEASE', False) is False
          PY

      - name: Checkout immutable capture tooling separately
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: test-results/listing-tooling
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: false

      - name: Install and verify required official Android SDK packages
        id: sdk
        timeout-minutes: 12
        run: |
          set -euo pipefail
          evidence=test-results/listing-media/sdk
          mkdir -p "$evidence"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Existing accepted SDK licenses only. EOF cannot accept a new license.
          # sdkmanager retains its own archive integrity checks; a corrupt ZIP
          # must fail instead of being used by Gradle's implicit NDK installer.
          installed=false
          for attempt in 1 2; do
            if timeout 300s "$sdkmanager" --sdk_root="$ANDROID_HOME" \
              'ndk;28.2.13676358' 'cmake;3.22.1' \
              'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' \
              </dev/null 2>&1 | tee "$evidence/sdkmanager-attempt-$attempt.log"; then
              installed=true
              break
            fi
          done
          test "$installed" = true
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          evidence = Path('test-results/listing-media/sdk')
          packages = {'ndk/28.2.13676358': '28.2.13676358',
                      'cmake/3.22.1': '3.22.1',
                      'build-tools/36.0.0': '36.0.0',
                      'platforms/android-36': None}
          receipt = {'sourceSha': os.environ['QA_SOURCE_SHA'], 'status': 'failed',
                     'checkedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'packages': []}
          try:
              for name, expected in packages.items():
                  props = sdk / name / 'source.properties'
                  raw = props.read_bytes()
                  text = raw.decode('utf-8')
                  values = dict(line.split('=', 1) for line in text.splitlines()
                                if '=' in line and not line.lstrip().startswith('#'))
                  values = {k.strip(): v.strip() for k, v in values.items()}
                  actual = values['Pkg.Revision']
                  assert expected is None or actual == expected, (name, actual, expected)
                  if name == 'platforms/android-36':
                      assert values['AndroidVersion.ApiLevel'] == '36'
                  (evidence / (name.replace('/', '-')+'-source.properties')).write_bytes(raw)
                  receipt['packages'].append({'path': name, 'revision': actual,
                      'sourcePropertiesSha256': hashlib.sha256(raw).hexdigest()})
              assert (sdk / 'ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang').is_file()
              assert (sdk / 'cmake/3.22.1/bin/cmake').is_file()
              assert (sdk / 'build-tools/36.0.0/aapt2').is_file()
              receipt['status'] = 'verified'
          finally:
              (evidence / 'sdk-verification.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY

      - name: Build only local QA APK without provider credentials
        id: compile
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p test-results/listing-media/build
          flutter --version --machine > test-results/listing-media/build/flutter-version.json
          flutter pub get --enforce-lockfile 2>&1 | tee test-results/listing-media/build/pub-get.log
          git diff --exit-code
          flutter build apk --debug --target-platform=android-x64 --dart-define-from-file=tool/qa_defines.json 2>&1 | tee test-results/listing-media/build/flutter-build.log
          (cd android && ./gradlew --stop)
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Enable hosted KVM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Checkout pinned emulator runner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: test-results/hosted-emulator-runner
          persist-credentials: false

      - name: Preserve existing passive startup guard
        run: |
          mkdir -p test-results/maestro-prewarm
          python3 scripts/prepare_hosted_emulator_runner.py

      - name: Capture real visible English or Spanish UI
        id: capture
        timeout-minutes: 23
        uses: ./test-results/hosted-emulator-runner
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          emulator-port: 5554
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          script: python3 test-results/listing-tooling/scripts/listing_media_capture.py --locale '${{ matrix.locale }}' --source "$QA_SOURCE_SHA" --apk build/app/outputs/flutter-apk/app-debug.apk --output 'test-results/listing-media/${{ matrix.locale }}'

      - name: Bound media artifact size
        if: always()
        env:
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          BUILD_OUTCOME: ${{ steps.compile.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          CAPTURE_LOCALE: ${{ matrix.locale }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          root = Path('test-results/listing-media')
          root.mkdir(parents=True, exist_ok=True)
          # Pre-capture failures must also retain a factual stage receipt.
          receipt = {'sourceSha': os.environ['QA_SOURCE_SHA'],
                     'workflowSha': os.environ['GITHUB_SHA'],
                     'runId': os.environ['GITHUB_RUN_ID'],
                     'locale': os.environ['CAPTURE_LOCALE'],
                     'recordedAtUtc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'sdkOutcome': os.environ['SDK_OUTCOME'],
                     'buildOutcome': os.environ['BUILD_OUTCOME'],
                     'captureOutcome': os.environ['CAPTURE_OUTCOME'],
                     'boundary': 'Stage outcomes only; no successful capture is inferred from artifact upload.'}
          (root / 'stage-outcomes.json').write_text(json.dumps(receipt, indent=2)+'\n')
          files = list(root.rglob('*'))
          assert not any(p.is_symlink() for p in files)
          assert sum(p.stat().st_size for p in files if p.is_file()) < 190 * 1024**2
          PY

      - name: Retain candidates and failed-capture evidence for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: axiomara-listing-media-${{ matrix.locale }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: test-results/listing-media/**
          if-no-files-found: error
          retention-days: 3
