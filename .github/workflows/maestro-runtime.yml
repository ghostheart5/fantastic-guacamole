name: Maestro Runtime Gate

on:
  workflow_dispatch:
    inputs:
      flow_glob:
        description: 'Flow or directory to execute (for example .maestro/flows)'
        required: false
        default: '.maestro/flows'
      allow_destructive:
        description: 'Allow flows tagged destructive (requires the exact confirmation below)'
        required: false
        type: boolean
        default: false
      destructive_confirmation:
        description: 'For destructive execution only, type: DELETE DISPOSABLE ACCOUNT'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  runtime:
    # This gate is intentionally separate from source CI. It requires a
    # maintainer-provided self-hosted runner with a prepared app/device and
    # never builds or publishes an APK/AAB.
    runs-on: [self-hosted, android, maestro]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout flow definitions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify runtime prerequisites
        shell: bash
        run: |
          command -v maestro
          command -v adb
          adb get-state | grep -q '^device$'
          maestro --version

      - name: Execute approved Maestro flows
        shell: bash
        env:
          FLOW_GLOB: ${{ inputs.flow_glob }}
          ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive }}
          DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          MAESTRO_SIGNUP_EMAIL: ${{ secrets.MAESTRO_SIGNUP_EMAIL }}
          MAESTRO_SIGNUP_PASSWORD: ${{ secrets.MAESTRO_SIGNUP_PASSWORD }}
        run: |
          mkdir -p artifacts/maestro
          args=(test "$FLOW_GLOB" --format junit --output artifacts/maestro/results.xml)
          if [[ "$ALLOW_DESTRUCTIVE" == "true" ]]; then
            if [[ "$DESTRUCTIVE_CONFIRMATION" != "DELETE DISPOSABLE ACCOUNT" ]]; then
              echo "::error::Destructive execution requires the exact disposable-account confirmation."
              exit 1
            fi
          else
            args+=(--exclude-tags destructive)
          fi
          maestro "${args[@]}"

      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-maestro-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/maestro/results.xml
