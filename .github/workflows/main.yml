name: Deploy ChronoSpark Public Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/privacy/**'
      - 'web/terms/**'
      - 'web/support/**'
      - 'web/delete-account/**'
      - 'web/legal.css'
      - 'web/.well-known/assetlinks.json'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/privacy/**'
      - 'web/terms/**'
      - 'web/support/**'
      - 'web/delete-account/**'
      - 'web/legal.css'
      - 'web/.well-known/assetlinks.json'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout public-site source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify static-site source is complete
        shell: bash
        run: |
          set -euo pipefail
          for path in site/index.html site/app/index.html site/features/index.html site/download/index.html site/assets/site.css site/assets/site.js site/assets/chronospark-temporal-field.jpg site/assets/social-card.png web/privacy/index.html web/terms/index.html web/support/index.html web/delete-account/index.html web/legal.css web/.well-known/assetlinks.json; do
            if [ ! -f "$path" ]; then
              echo "::error::Static Pages source is incomplete: $path"
              exit 1
            fi
          done

      - name: Assemble static public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          for route in privacy terms support delete-account; do
            mkdir -p "_site/$route"
            cp "web/$route/index.html" "_site/$route/index.html"
          done
          cp web/legal.css _site/legal.css
          mkdir -p _site/.well-known
          cp web/.well-known/assetlinks.json _site/.well-known/assetlinks.json
          touch _site/.nojekyll

      - name: Verify public-route contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('_site')
          required = {
              'index.html': ('ChronoSpark', 'Understand the day', 'One human loop'),
              'features/index.html': ('System map', 'Nexus', 'Trajectory', 'Product model, not a screenshot'),
              'download/index.html': ('Install only from a verified path',),
              'support/index.html': ('Working contact path', 'ghostheart131517@gmail.com'),
              'privacy/index.html': ('Privacy Policy', 'Current release containment'),
              'terms/index.html': ('Terms of Service', 'Subscriptions, AI-credit purchases, and credit spending are not enabled'),
              'delete-account/index.html': ('Delete a ChronoSpark Account',),
              'app/index.html': ('No verified web app is published here',),
              'robots.txt': ('Sitemap:',),
              'sitemap.xml': ('/privacy/', '/delete-account/'),
          }
          for relative, markers in required.items():
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Missing required public route: {relative}')
              text = path.read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative} missing expected content: {missing}')
          social_pages = {
              'index.html': 'https://ghostheart5.github.io/fantastic-guacamole/',
              'features/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/features/',
              'download/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/download/',
              'support/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/support/',
              'privacy/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/privacy/',
              'terms/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/terms/',
              'delete-account/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/delete-account/',
          }
          social_image = 'https://ghostheart5.github.io/fantastic-guacamole/assets/social-card.png'
          for relative, canonical_url in social_pages.items():
              text = (root / relative).read_text(encoding='utf-8')
              for marker in (
                  'property="og:title"',
                  'property="og:description"',
                  f'property="og:url" content="{canonical_url}"',
                  f'property="og:image" content="{social_image}"',
                  'name="twitter:card" content="summary_large_image"',
              ):
                  if marker not in text:
                      raise SystemExit(f'{relative} is missing required social metadata: {marker}')
          if not (root / 'assets/social-card.png').is_file():
              raise SystemExit('The public social-card image is missing.')
          asset_links_path = root / '.well-known/assetlinks.json'
          try:
              asset_links = json.loads(asset_links_path.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as error:
              raise SystemExit(f'Invalid Android asset-links file: {error}') from error
          if not isinstance(asset_links, list):
              raise SystemExit('Android asset-links file must contain a JSON array.')
          matching_links = []
          for entry in asset_links:
              if not isinstance(entry, dict):
                  continue
              target = entry.get('target')
              if not isinstance(target, dict):
                  continue
              if (
                  target.get('namespace') == 'android_app'
                  and target.get('package_name') == 'com.ghostheart5.chronospark'
                  and entry.get('relation') == ['delegate_permission/common.handle_all_urls']
              ):
                  matching_links.append(entry)
          if len(matching_links) != 1:
              raise SystemExit('Android asset-links file must contain exactly one ChronoSpark app link.')
          expected_fingerprint = 'B8:3E:42:1A:CC:08:11:68:EA:6F:7A:16:72:53:26:59:DC:87:B0:0D:69:77:9E:86:E4:B8:02:06:4F:B7:D7:DB'
          fingerprints = matching_links[0]['target'].get('sha256_cert_fingerprints')
          if fingerprints != [expected_fingerprint]:
              raise SystemExit('Android asset-links fingerprint does not match the Play app-signing certificate.')
          assembled = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in root.rglob('*.html')
          )
          for forbidden in (
              'support@chronospark.app',
              'play.google.com/store/apps/details?id=com.ghostheart5.chronospark',
              'English and Spanish',
          ):
              if forbidden in assembled:
                  raise SystemExit(f'Public site contains a forbidden or unverified claim: {forbidden}')
          cname = root / 'CNAME'
          if cname.exists() and 'chronospark.app' in cname.read_text(encoding='utf-8'):
              raise SystemExit('A custom domain must not be added without separate approval.')

      - name: Upload public-site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
