name: Deploy Gated Flutter Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  resolve-authoritative-gate:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve successful same-commit web gate
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `authoritative-release-gate-${context.sha}-production-web`;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'authoritative-release-gate.yml',
              status: 'completed',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.head_sha !== context.sha || run.conclusion !== 'success') continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              if (artifacts.some((artifact) => artifact.name === artifactName && !artifact.expired)) {
                core.setOutput('run_id', String(run.id));
                return;
              }
            }
            core.setFailed(`No completed authoritative production-web gate exists for ${context.sha}.`);

  prepare-gated-pages:
    needs: resolve-authoritative-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Download exact gated web candidate
        uses: actions/download-artifact@v4
        with:
          name: authoritative-release-gate-${{ github.sha }}-production-web
          run-id: ${{ needs.resolve-authoritative-gate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authoritative-release-gate

      - name: Verify and unpack exact gated web candidate
        shell: pwsh
        run: |
          $gateRoot = "${{ runner.temp }}/authoritative-release-gate"
          $manifestPath = Join-Path $gateRoot 'release-gate-manifest.json'
          ./scripts/authoritative_release_gate.ps1 `
            -Mode VerifyManifest `
            -ManifestPath $manifestPath `
            -ExpectedCommit "${{ github.sha }}"
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.buildFlavor -ne 'production-web') {
            throw 'Authoritative gate flavor is not production-web.'
          }
          $source = Join-Path $gateRoot $manifest.binaryPath
          if ([IO.Path]::GetExtension($source) -ne '.zip') {
            throw 'Authoritative production-web gate did not contain a ZIP candidate.'
          }
          $output = "${{ runner.temp }}/gated-web"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Expand-Archive -LiteralPath $source -DestinationPath $output
          if (-not (Test-Path -LiteralPath (Join-Path $output 'index.html'))) {
            throw 'Gated web candidate must contain index.html at the ZIP root.'
          }

      - name: Upload exact gated Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gated-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: prepare-gated-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gated candidate to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
