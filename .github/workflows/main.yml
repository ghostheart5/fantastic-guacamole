name: Deploy ChronoSpark Public Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/privacy/**'
      - 'web/terms/**'
      - 'web/support/**'
      - 'web/delete-account/**'
      - 'web/legal.css'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public-site source
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R site/. _site/
          cp feature.png _site/assets/social-card.png
          for route in privacy terms support delete-account; do
            mkdir -p "_site/$route"
            cp "web/$route/index.html" "_site/$route/index.html"
          done
          cp web/legal.css _site/legal.css
          touch _site/.nojekyll

      - name: Verify public-route contract
        shell: python
        run: |
          from pathlib import Path

          root = Path('_site')
          required = {
              'index.html': ('ChronoSpark', 'Understand the day'),
              'features/index.html': ('Feature proof', 'Nexus'),
              'download/index.html': ('Install only from a verified path',),
              'support/index.html': ('ChronoSpark Support',),
              'privacy/index.html': ('ChronoSpark Privacy Policy',),
              'terms/index.html': ('ChronoSpark Terms of Service',),
              'delete-account/index.html': ('Delete a ChronoSpark Account',),
              'app/index.html': ('verified web app is not published here yet',),
              'robots.txt': ('Sitemap:',),
              'sitemap.xml': ('/privacy/', '/delete-account/'),
          }
          for relative, markers in required.items():
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Missing required public route: {relative}')
              text = path.read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative} missing expected content: {missing}')
          social_pages = {
              'index.html': 'https://ghostheart5.github.io/fantastic-guacamole/',
              'features/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/features/',
              'download/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/download/',
              'support/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/support/',
              'privacy/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/privacy/',
              'terms/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/terms/',
              'delete-account/index.html': 'https://ghostheart5.github.io/fantastic-guacamole/delete-account/',
          }
          social_image = 'https://ghostheart5.github.io/fantastic-guacamole/assets/social-card.png'
          for relative, canonical_url in social_pages.items():
              text = (root / relative).read_text(encoding='utf-8')
              for marker in (
                  'property="og:title"',
                  'property="og:description"',
                  f'property="og:url" content="{canonical_url}"',
                  f'property="og:image" content="{social_image}"',
                  'name="twitter:card" content="summary"',
              ):
                  if marker not in text:
                      raise SystemExit(f'{relative} is missing required social metadata: {marker}')
          if not (root / 'assets/social-card.png').is_file():
              raise SystemExit('The public social-card image is missing.')
          cname = root / 'CNAME'
          if cname.exists() and 'chronospark.app' in cname.read_text(encoding='utf-8'):
              raise SystemExit('A custom domain must not be added without separate approval.')

      - name: Upload public-site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
