name: Validate Axiomara Required Public Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/404.html'
      - 'site/assets/site.css'
      - 'site/robots.txt'
      - 'site/sitemap.xml'
      - 'web/privacy/**'
      - 'web/terms/**'
      - 'web/support/**'
      - 'web/delete-account/**'
      - 'web/legal.css'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated minimal pages from main'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: axiomara-required-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout required-page source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify required source exists
        shell: bash
        run: |
          set -euo pipefail
          for path in site/index.html site/404.html site/assets/site.css site/robots.txt site/sitemap.xml web/privacy/index.html web/terms/index.html web/support/index.html web/delete-account/index.html web/legal.css; do
            if [ ! -f "$path" ]; then
              echo "::error::Required public source is missing: $path"
              exit 1
            fi
          done

      - name: Assemble only the required public surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/404.html _site/404.html
          cp site/assets/site.css _site/assets/site.css
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp web/legal.css _site/legal.css
          for route in privacy terms support delete-account; do
            mkdir -p "_site/$route"
            cp "web/$route/index.html" "_site/$route/index.html"
          done
          touch _site/.nojekyll

      - name: Verify minimal public contract
        shell: python
        run: |
          from pathlib import Path

          root = Path('_site')
          required = {
              'index.html': ('Axiomara', 'Private testing', 'Required public information', 'does not provide a public download'),
              'privacy/index.html': ('Axiomara Privacy Policy', 'does not display ads', 'Anthropic', 'account-deletion page'),
              'terms/index.html': ('Axiomara Terms of Service', 'Marketplace purchases', 'does not provide unlimited AI usage'),
              'support/index.html': ('Axiomara Support', 'Email Axiomara support', 'does not provide an APK or public download'),
              'delete-account/index.html': ('Delete an Axiomara Account', 'Request deletion without the app', 'Request account deletion'),
              '404.html': ('Page unavailable', 'required privacy, terms, support, and account-deletion pages'),
              'robots.txt': ('Sitemap: https://ghostheart5.github.io/fantastic-guacamole/sitemap.xml',),
              'sitemap.xml': ('https://ghostheart5.github.io/fantastic-guacamole/privacy/', 'https://ghostheart5.github.io/fantastic-guacamole/delete-account/'),
          }
          for relative, markers in required.items():
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Missing required public route: {relative}')
              text = path.read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative} missing required content: {missing}')

          allowed = {
              'index.html', '404.html', 'robots.txt', 'sitemap.xml', '.nojekyll',
              'assets/site.css', 'legal.css',
              'privacy/index.html', 'terms/index.html', 'support/index.html',
              'delete-account/index.html',
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob('*')
              if path.is_file()
          }
          unexpected = sorted(actual - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected public files expose unnecessary content: {unexpected}')

          landing = (root / 'index.html').read_text(encoding='utf-8')
          for forbidden in ('Smart Planner', 'SI Console', 'Nexus', 'Trajectory', 'Creator', 'screenshot', 'feature graphic'):
              if forbidden in landing:
                  raise SystemExit(f'Landing page exposes unnecessary product detail: {forbidden}')

          forbidden_identity = (
              'chrono' + 'spark',
              'google' + ' play',
              'play.' + 'google.com',
          )
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              lowered = text.lower()
              leaked = [value for value in forbidden_identity if value in lowered]
              if leaked:
                  raise SystemExit(f'{path.relative_to(root)} exposes retired identity or marketplace branding: {leaked}')

      - name: Package approved deployment artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish the approved required pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
