name: Validate Axiomara Product Site

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/404.html'
      - 'site/assets/site.css'
      - 'site/assets/site.js'
      - 'site/assets/axiomara-icon.png'
      - 'site/assets/axiomara-feature.png'
      - 'site/robots.txt'
      - 'site/sitemap.xml'
      - 'web/privacy/**'
      - 'web/terms/**'
      - 'web/support/**'
      - 'web/delete-account/**'
      - 'web/legal.css'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated Axiomara product site from main'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: axiomara-product-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Axiomara site source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify site source exists
        shell: bash
        run: |
          set -euo pipefail
          for path in site/index.html site/404.html site/assets/site.css site/assets/site.js site/assets/axiomara-icon.png site/assets/axiomara-feature.png site/robots.txt site/sitemap.xml web/privacy/index.html web/terms/index.html web/support/index.html web/delete-account/index.html web/legal.css; do
            if [ ! -f "$path" ]; then
              echo "::error::Required public source is missing: $path"
              exit 1
            fi
          done

      - name: Assemble product and required public surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp site/index.html _site/index.html
          cp site/404.html _site/404.html
          cp site/assets/site.css _site/assets/site.css
          cp site/assets/site.js _site/assets/site.js
          cp site/assets/axiomara-icon.png _site/assets/axiomara-icon.png
          cp site/assets/axiomara-feature.png _site/assets/axiomara-feature.png
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp web/legal.css _site/legal.css
          for route in privacy terms support delete-account; do
            mkdir -p "_site/$route"
            cp "web/$route/index.html" "_site/$route/index.html"
          done
          touch _site/.nojekyll

      - name: Verify Axiomara public contract
        shell: python
        run: |
          from pathlib import Path

          root = Path('_site')
          required = {
              'index.html': ('AXIOMARA', 'The Human Decision OS', 'Nine connected systems', 'Smart Planner', 'SI Console', 'NO ADS', 'does not provide an application download'),
              'privacy/index.html': ('Axiomara Privacy Policy', 'does not display ads', 'Anthropic', 'account-deletion page'),
              'terms/index.html': ('Axiomara Terms of Service', 'Marketplace purchases', 'does not provide unlimited AI usage'),
              'support/index.html': ('Axiomara Support', 'Email Axiomara support', 'does not provide an APK or public download'),
              'delete-account/index.html': ('Delete an Axiomara Account', 'Request deletion without the app', 'Request account deletion'),
              '404.html': ('Page unavailable', 'Axiomara'),
              'robots.txt': ('Sitemap: https://ghostheart5.github.io/fantastic-guacamole/sitemap.xml',),
              'sitemap.xml': ('https://ghostheart5.github.io/fantastic-guacamole/privacy/', 'https://ghostheart5.github.io/fantastic-guacamole/delete-account/'),
          }
          for relative, markers in required.items():
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'Missing required public route: {relative}')
              text = path.read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative} missing required content: {missing}')

          allowed = {
              'index.html', '404.html', 'robots.txt', 'sitemap.xml', '.nojekyll',
              'assets/site.css', 'assets/site.js', 'assets/axiomara-icon.png',
              'assets/axiomara-feature.png', 'legal.css',
              'privacy/index.html', 'terms/index.html', 'support/index.html',
              'delete-account/index.html',
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob('*')
              if path.is_file()
          }
          unexpected = sorted(actual - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected public file: {unexpected}')

          for asset in ('assets/axiomara-icon.png', 'assets/axiomara-feature.png'):
              if (root / asset).stat().st_size < 20_000:
                  raise SystemExit(f'Brand asset is unexpectedly small: {asset}')

          forbidden_identity = (
              'chrono' + 'spark',
              'google' + ' play',
              'play.' + 'google.com',
          )
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css', '.js', '.txt', '.xml'}:
                  continue
              text = path.read_text(encoding='utf-8')
              lowered = text.lower()
              leaked = [value for value in forbidden_identity if value in lowered]
              if leaked:
                  raise SystemExit(f'{path.relative_to(root)} exposes retired identity or marketplace branding: {leaked}')

      - name: Package approved Axiomara site
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Publish the approved Axiomara site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
