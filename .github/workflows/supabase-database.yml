name: Supabase Database Gate

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0

      - name: Set up Deno matching the Edge runtime generation
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.1.4

      - name: Run Edge Function and drift tests
        run: >-
          deno test
          --allow-read=supabase
          --allow-env=SUPABASE_URL,SUPABASE_SECRET_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_PUBLISHABLE_KEY,SUPABASE_ANON_KEY
          supabase/functions
          supabase/drift

      - name: Lint deployable Edge Functions and drift verifier
        run: deno lint supabase/functions supabase/drift/verify_manifest.ts

      - name: Type-check deployable Edge Function entrypoints
        run: deno check supabase/functions/*/index.ts

      - name: Replay migrations on a clean database
        run: supabase db start

      - name: Run pgTAP contracts
        run: supabase test db --local supabase/tests

      - name: Lint public database functions
        run: supabase db lint --local --schema public --fail-on error
