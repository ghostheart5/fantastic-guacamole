name: Supabase Database Gate

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify exact source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.1.4

      - name: Type-check and test Edge Functions
        shell: pwsh
        run: ./scripts/edge_function_gate.ps1 -RunTests

      - name: Validate migration replay policy
        shell: pwsh
        run: ./scripts/supabase_migration_policy_contract.ps1

      - name: Start disposable Supabase backend
        run: supabase start

      - name: Run database contracts
        run: supabase test db

      - name: Lint public database schema
        run: supabase db lint --local --schema public --fail-on error

      - name: Stop disposable Supabase backend
        if: always()
        run: supabase stop --no-backup
