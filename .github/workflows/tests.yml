name: ChronoSpark Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Run Build-Critical Flutter Tests
        id: critical_tests
        run: |
          flutter test test/unit
          flutter test test/smoke
          flutter test test/behavior/secrets_guard_test.dart test/behavior/no_network_in_unit_tests_test.dart test/behavior/test_secret_hygiene_contract_test.dart

      - name: Run Extended Flutter Tests
        id: extended_tests
        run: |
          flutter test --coverage --exclude-tags=golden
          flutter test test/integration
          flutter test test/features
          flutter test test/providers
          flutter test test/behavior

      - name: Install Robot Framework
        id: install_robot
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install robotframework selenium

      - name: Run Robot Tests
        id: robot_tests
        continue-on-error: true
        run: robot test/robot

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## ChronoSpark Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Build-critical tests: ${{ steps.critical_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Extended tests: ${{ steps.extended_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Robot install (non-blocking): ${{ steps.install_robot.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Robot tests (non-blocking): ${{ steps.robot_tests.outcome }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.extended_tests.outcome }}" != "success" ] || [ "${{ steps.robot_tests.outcome }}" != "success" ]; then
            echo "Nonblocking test stages reported issues. Build-critical tests still control pass/fail." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/lcov.info

  golden:
    name: Golden Tests (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - name: Create safe local configuration asset
        shell: pwsh
        run: Copy-Item -LiteralPath .env.example -Destination .env

      - name: Run canonical Windows golden tests
        run: flutter test test/golden --concurrency=1
