name: CI/CD

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    name: Static policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact source commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "Checkout SHA $actual does not match event SHA ${{ github.sha }}."
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked checkout is dirty before the static gate.'
          }
          New-Item -ItemType Directory -Force artifacts/static-evidence | Out-Null
          [ordered]@{
            schemaVersion = 1
            commit = $actual
            repository = '${{ github.repository }}'
            workflow = '${{ github.workflow }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
          } | ConvertTo-Json | Set-Content artifacts/static-evidence/exact-commit.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_root="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_root"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_root" actionlint
          "$install_root/actionlint" -version
          echo "ACTIONLINT=$install_root/actionlint" >> "$GITHUB_ENV"

      - name: Lint GitHub Actions workflows
        run: $ACTIONLINT -no-color

      - name: Validate GitHub workflow controls
        run: dart run tool/validate_github_workflows.dart

      - name: Parse maintained PowerShell sources
        shell: pwsh
        run: ./scripts/powershell_parse_gate.ps1

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool scripts

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Run secret content guard
        shell: pwsh
        run: ./scripts/secret_content_guard.ps1

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Validate architecture
        shell: pwsh
        run: ./check_architecture.ps1

      - name: Validate Maestro flow contracts
        run: dart run tool/validate_maestro_flows.dart

      - name: Verify golden comparison contract
        shell: pwsh
        run: ./scripts/golden_assertion_guard.ps1

      - name: Validate coverage guard contracts
        shell: pwsh
        run: ./scripts/coverage_guard_contract.ps1

      - name: Validate version guard contracts
        shell: pwsh
        run: ./scripts/version_consistency_guard_contract.ps1

      - name: Validate version consistency
        shell: pwsh
        run: ./scripts/version_consistency_guard.ps1

      - name: Generate dependency audit evidence
        shell: pwsh
        run: ./scripts/dependency_audit.ps1

      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-static-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/static-evidence/**
            artifacts/dependency-audit/**

  flutter-tests:
    name: Flutter unit and widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify exact source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p artifacts/flutter-test-evidence
          printf '{"schemaVersion":1,"commit":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > artifacts/flutter-test-evidence/exact-commit.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Run bounded tests with coverage evidence
        run: dart run tool/run_flutter_tests.dart --report artifacts/flutter-test-evidence/flutter-tests.jsonl --manifest artifacts/flutter-test-evidence/flutter-tests-manifest.json --timeout-seconds 3600 -- test --no-pub --coverage --concurrency=1

      - name: Run QA compile-time configuration contract
        run: dart run tool/run_flutter_tests.dart --report artifacts/flutter-test-evidence/qa-config-tests.jsonl --manifest artifacts/flutter-test-evidence/qa-config-tests-manifest.json --timeout-seconds 600 -- test/config/env_mode_resolution_test.dart --no-pub --dart-define-from-file=tool/qa_defines.json

      - name: Enforce coverage and critical-test contracts
        shell: pwsh
        run: ./scripts/coverage_guard.ps1 -Mode ratchet

      - name: Upload Flutter test evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-flutter-tests-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            coverage/lcov.info
            artifacts/flutter-test-evidence/**
            test/**/failures/**

  linux-integration:
    name: Linux app-root integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify exact source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p artifacts/integration-evidence
          printf '{"schemaVersion":1,"commit":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > artifacts/integration-evidence/exact-commit.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Install Linux integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            liblzma-dev

      - name: Run app-root integration tests
        run: bash ./scripts/run_linux_integration_tests.sh

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-linux-integration-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/integration-evidence/**

  windows-goldens:
    name: Windows golden comparisons
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify exact source commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "Checkout SHA $actual does not match event SHA ${{ github.sha }}."
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked checkout is dirty before the Windows golden gate.'
          }
          New-Item -ItemType Directory -Force artifacts/windows-golden-evidence | Out-Null
          [ordered]@{
            schemaVersion = 1
            commit = $actual
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
          } | ConvertTo-Json | Set-Content artifacts/windows-golden-evidence/exact-commit.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'

      - name: Create safe local configuration asset
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Run bounded Windows golden comparisons
        run: dart run tool/run_flutter_tests.dart --report artifacts/windows-golden-evidence/golden-tests.jsonl --manifest artifacts/windows-golden-evidence/golden-tests-manifest.json --timeout-seconds 1200 -- test/features/auth/login_screen_golden_test.dart test/features/home/first_use_context_offer_card_test.dart test/features/nexus/nexus_screen_golden_test.dart test/features/settings/settings_screen_test.dart --no-pub --concurrency=1

      - name: Upload Windows golden evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-windows-goldens-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/windows-golden-evidence/**
            test/**/failures/**

  test:
    name: Analyze & Test
    if: always()
    needs: [static-policy, flutter-tests, linux-integration, windows-goldens]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every required CI job result
        env:
          STATIC_RESULT: ${{ needs.static-policy.result }}
          FLUTTER_RESULT: ${{ needs.flutter-tests.result }}
          INTEGRATION_RESULT: ${{ needs.linux-integration.result }}
          WINDOWS_GOLDEN_RESULT: ${{ needs.windows-goldens.result }}
        run: |
          set -euo pipefail
          for result in \
            "$STATIC_RESULT" \
            "$FLUTTER_RESULT" \
            "$INTEGRATION_RESULT" \
            "$WINDOWS_GOLDEN_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job ended with result: $result"
              exit 1
            fi
          done
