name: CI/CD

on:
  workflow_call:
  push:
    branches:
      - "main"
      - "release/chronospark-production-candidate-20260821"
    paths-ignore:
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record exact source commit
        id: source
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "Checkout SHA $actual does not match event SHA ${{ github.sha }}."
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked checkout is dirty before the quality gate.'
          }
          New-Item -ItemType Directory -Force artifacts/ci-evidence | Out-Null
          [ordered]@{
            schemaVersion = 1
            commit = $actual
            repository = '${{ github.repository }}'
            workflow = '${{ github.workflow }}'
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
          } | ConvertTo-Json | Set-Content artifacts/ci-evidence/exact-commit.json

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Run secret content guard
        shell: pwsh
        run: ./scripts/secret_content_guard.ps1

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Validate architecture
        shell: pwsh
        run: ./check_architecture.ps1

      - name: Validate Maestro flow contracts
        run: dart run tool/validate_maestro_flows.dart

      - name: Validate version guard contracts
        shell: pwsh
        run: ./scripts/version_consistency_guard_contract.ps1

      - name: Validate version consistency
        shell: pwsh
        run: ./scripts/version_consistency_guard.ps1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.1.4

      - name: Type-check and test Supabase Edge Functions
        shell: pwsh
        run: ./scripts/edge_function_gate.ps1 -RunTests

      - name: Validate Supabase migration policy replay
        shell: pwsh
        run: ./scripts/supabase_migration_policy_contract.ps1

      - name: Start disposable Supabase backend
        run: npx --yes supabase@2.115.0 start

      - name: Test database schema and RLS
        run: npx --yes supabase@2.115.0 test db

      - name: Generate dependency audit evidence
        shell: pwsh
        run: ./scripts/dependency_audit.ps1

      - name: Run tests with coverage
        run: flutter test test --coverage --concurrency=1

      - name: Install Linux integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev \
            liblzma-dev

      - name: Run app-root integration tests
        run: bash ./scripts/run_linux_integration_tests.sh

      - name: Enforce coverage and critical-test contracts
        shell: pwsh
        run: ./scripts/coverage_guard.ps1 -Mode ratchet

      - name: Stop disposable Supabase backend
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chronospark-ci-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            coverage/lcov.info
            artifacts/ci-evidence/**
            artifacts/dependency-audit/**
