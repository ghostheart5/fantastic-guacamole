name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Create safe local configuration asset
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Run security secret guard
        shell: pwsh
        run: ./scripts/security_secret_guard.ps1

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Validate architecture
        shell: pwsh
        run: ./check_architecture.ps1

      - name: Validate Maestro flow contracts
        run: dart run tool/validate_maestro_flows.dart

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Type-check and test Supabase Edge Functions
        run: |
          deno check supabase/functions/ai-proxy/index.ts
          deno check supabase/functions/account-delete/index.ts
          deno check supabase/functions/verify-receipt/index.ts
          deno test supabase/functions/_shared/storage_cleanup_test.ts

      - name: Run tests with coverage
        run: flutter test test --coverage --concurrency=1

      - name: Enforce coverage and critical-test contracts
        shell: pwsh
        run: ./scripts/coverage_guard.ps1 -Mode ratchet
