name: Hosted Profile Provisioning Repair

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected main commit with the reviewed repair
        required: true
        type: string
      ci_run:
        description: Successful CI run for this exact protected main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: axiomara-production-profile-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor == 'ghostheart5' && github.repository == 'ghostheart5/fantastic-guacamole' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require exact protected source and successful CI before production credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SOURCE: ${{ inputs.source_sha }}
          REVIEWED_CI: ${{ inputs.ci_run }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEWED_CI" =~ ^[1-9][0-9]*$ ]]
          test "$REVIEWED_SOURCE" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_CI" > "$RUNNER_TEMP/profile-repair-ci.json"
          jq -e --arg sha "$REVIEWED_SOURCE" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and
            .repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
            (.event == "push" or .event == "workflow_dispatch") and
            .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/profile-repair-ci.json"
      - name: Checkout reviewed repair
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up reviewed CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Apply only the reviewed profile migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = qpwhuckyirnqtmvhpede
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase db push --linked --dry-run --skip-vault --yes > "$RUNNER_TEMP/profile-migration-dry-run.txt" 2>&1
          python3 - "$RUNNER_TEMP/profile-migration-dry-run.txt" <<'PY'
          import re, sys
          from pathlib import Path
          selected = set(re.findall(r'\b\d{12,14}_[a-z0-9_-]+\.sql\b', Path(sys.argv[1]).read_text()))
          if selected != {'20260927075018_reconcile_profile_provisioning.sql'}:
              raise SystemExit('Dry run did not select only the reviewed profile migration; production unchanged.')
          PY
          supabase db push --linked --skip-vault --yes
          supabase migration list --linked > "$RUNNER_TEMP/profile-repair-migrations.txt"
      - name: Save migration inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: profile-repair-migrations-${{ github.sha }}
          path: ${{ runner.temp }}/profile-repair-migrations.txt
          if-no-files-found: error
          retention-days: 7
