name: Maestro Android Production Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run standard and isolated onboarding release suites
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            pwsh ./scripts/run_maestro.ps1 -Profile maestro -Suite maestro/release/release_full_validation.yaml -Device emulator-5554 -ReinstallDriver
            pwsh ./scripts/run_maestro.ps1 -Profile maestro-onboarding -Suite maestro/onboarding/_suite_onboarding.yaml -Device emulator-5554

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: maestro-production-validation-${{ github.run_id }}
          path: artifacts/maestro
          if-no-files-found: warn
