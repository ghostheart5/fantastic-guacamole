name: Maestro Android Production Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Prepare non-secret Flutter environment asset
        run: cp .env.example .env

      - name: Validate Maestro runner syntax before emulator startup
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run_maestro.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run standard and isolated onboarding release suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            pwsh ./scripts/run_maestro.ps1 -Profile maestro -Suite maestro/release/release_full_validation.yaml -Device emulator-5554 -ReinstallDriver
            pwsh ./scripts/run_maestro.ps1 -Profile maestro-onboarding -Suite maestro/onboarding/_suite_onboarding.yaml -Device emulator-5554

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-production-validation-${{ github.run_id }}
          path: artifacts/maestro
          if-no-files-found: warn
