name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build_mode: manual
            runner: macos-latest
          - language: javascript-typescript
            build_mode: none
            runner: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Default CodeQL setup is managed in repository settings, not by a
      # workflow token. Keeping this workflow read-only prevents CI from
      # silently changing security configuration. If both modes are enabled,
      # GitHub will fail the run and the maintainer can resolve it explicitly.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Set up Flutter
        if: matrix.language == 'swift'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable

      - name: Flutter pub get
        if: matrix.language == 'swift'
        run: flutter pub get

      - name: Prepare macOS build files
        if: matrix.language == 'swift'
        run: flutter build macos --debug --config-only

      - name: Build macOS app for CodeQL tracing
        if: matrix.language == 'swift'
        run: |
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/macos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          output: sarif-results
