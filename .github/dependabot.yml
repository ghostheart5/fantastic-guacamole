# Dependabot (Nov 26, 2026 Infrastructure Scan: Axiomara INF-11 "No automated dependency scanning", Dom's "GO").
# Weekly version-update PRs, grouped so each ecosystem opens at most one PR a week. Nothing merges on its own:
# every Dependabot PR still needs the maintainer review in CODEOWNERS and the normal CI checks.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    groups:
      flutter-packages:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    groups:
      android-gradle:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns: ["*"]
