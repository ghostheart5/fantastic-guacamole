appId: ${APP_ID}
---
- runFlow: ../_common/go_to_smart_planner.yaml
- tapOn:
    id: "smart-planner-context-input"
- eraseText
- inputText: "What should I do next?"
- hideKeyboard
- tapOn:
    id: "smart-planner-submit"
- assertVisible:
    text: "Getting insight..."
    optional: true
- assertVisible:
    text: "SMART INSIGHT"
    optional: true
