appId: ${APP_ID}
---
- runFlow: ../_common/go_to_smart_planner.yaml
- tapOn:
    id: "smart-planner-context-input"
- eraseText
- inputText: "What should I do next?"
- hideKeyboard
- tapOn:
    id: "smart-planner-submit"
- extendedWaitUntil:
    visible:
      text: "Getting insight...|SMART INSIGHT"
    timeout: 30000
- assertVisible:
    text: "SMART INSIGHT"
