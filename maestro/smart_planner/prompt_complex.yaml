appId: ${APP_ID}
---
- runFlow: ../_common/go_to_smart_planner.yaml
- tapOn:
    id: "smart-planner-context-input"
- eraseText
- inputText: "I have conflicting deadlines, low energy, and need a risk-aware action plan for work, health, and study in the next 48 hours."
- hideKeyboard
- tapOn:
    id: "smart-planner-submit"
- assertVisible:
    text: "Why this action?"
    optional: true
