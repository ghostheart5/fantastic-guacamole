appId: ${APP_ID}
---
# Smart Planner and SI Console are different surfaces. This verifies that a
# visible request/response draft from one is not rendered as the other's UI.
- runFlow: ../_common/go_to_smart_planner.yaml
- tapOn:
    id: "smart-planner-context-input"
- eraseText
- inputText: "MAESTRO_SMART_PLANNER_SURFACE_PROBE"
- hideKeyboard
- runFlow: ../_common/go_to_si_console.yaml
- assertVisible:
    id: "si-console-input"
- assertNotVisible:
    text: "MAESTRO_SMART_PLANNER_SURFACE_PROBE"
- runFlow: ../si_console/si_console_command_roundtrip.yaml
- runFlow: ../_common/go_to_smart_planner.yaml
- assertVisible:
    id: "smart-planner-context-input"
- assertNotVisible:
    id: "si-console-guide-response"
