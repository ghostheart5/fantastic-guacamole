appId: ${APP_ID}
---
- runFlow: ../authentication/login_with_env.yaml
- runFlow: ../_common/go_to_creator.yaml
- tapOn:
    text: "Goal"
- tapOn:
    text: "Item title *"
- inputText: "Maestro Goal"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Create item"
    direction: DOWN
    timeout: 30000
- tapOn: "Create item"
- assertVisible: "Goal saved."
