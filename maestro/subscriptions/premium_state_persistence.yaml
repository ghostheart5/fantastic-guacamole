- tapOn:
    text: "Subscription Details"
    optional: true
- assertVisible:
    text: "Plan:"
    optional: true
- stopApp
- launchApp:
    clearState: false
    stopApp: true
- runFlow: ../_common/go_to_settings.yaml
- tapOn:
    text: "Billing Center"
    optional: true
