# P2 — SI Console.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Chat"

- assertVisible: "^Chat$"

# The screen must expose its current source-aware contract, not only a title.
- assertVisible: '(?s)^Ask about your saved plans.*This mode uses local rules.*does not send questions to AI chat or spend AI credits[.].*'
- assertVisible: "No saved planning information yet. This tool will explain what it cannot answer. None of your shared details apply to this question."

# A normal typed evidence question must return a structured, on-device Assistant
# response. Use the persistent composer instead of relying on an off-screen
# suggestion chip.
- tapOn: "(?s)^Your question.*"
- inputText: "What evidence is missing?"
- runFlow: ../subflows/dismiss-android-keyboard.yaml
- tapOn: "Send to Chat"
# The transcript follows the response footer, which can clip the first section.
# Wait for completion, then reveal and verify each required response section.
- extendedWaitUntil:
    visible: "Why this appears: Read-only response made on this device from the selected records."
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*Processing mode: On this device.*"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "(?s).*Processing mode: On this device.*"
- scrollUntilVisible:
    element:
      text: "DIRECT ANSWER"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "DIRECT ANSWER"
- scrollUntilVisible:
    element:
      text: "RECOMMENDATION"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "RECOMMENDATION"

# A typed local status request must disclose the current evidence boundary.
- tapOn: "(?s)^Your question.*"
- inputText: "/status"
- assertVisible: "(?s).*/status.*"
- runFlow: ../subflows/dismiss-android-keyboard.yaml
- tapOn: "Send to Chat"
- extendedWaitUntil:
    visible: "(?s).*ASSISTANT STATUS.*Read-only Chat:.*"
    timeout: 10000
# Auto-scroll can leave this reply's mode tag above its body.
- scrollUntilVisible:
    element:
      text: "(?s).*Processing mode: On this device.*"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "(?s).*Processing mode: On this device.*"

# Unsupported input must fail explicitly without discarding or sending text.
- tapOn: "(?s)^Your question.*"
- inputText: "/not-real preserve this"
- assertVisible: "(?s).*/not-real preserve this.*"
- runFlow: ../subflows/dismiss-android-keyboard.yaml
- tapOn: "Send to Chat"
- extendedWaitUntil:
    visible: "(?s).*Unknown shortcut.*No part of the request was sent or discarded.*"
    timeout: 10000
# Auto-scroll can leave this reply's mode tag above its body.
- scrollUntilVisible:
    element:
      text: "(?s).*Processing mode: On this device .fallback..*"
    direction: UP
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "(?s).*Processing mode: On this device .fallback..*"

# Crisis language must preempt ordinary SI output and stay local.
- tapOn: "(?s)^Your question.*"
- inputText: "I want to kill myself"
- assertVisible: "(?s).*I want to kill myself.*"
- runFlow: ../subflows/dismiss-android-keyboard.yaml
- tapOn: "Send to Chat"
- extendedWaitUntil:
    visible: "Let's pause and focus on your safety"
    timeout: 10000
- assertNotVisible: "(?s).*Processing mode: AI chat.*"
