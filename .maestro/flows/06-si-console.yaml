# P2 — SI Console.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "SI Console"

- assertVisible: "SI CONSOLE"

# The greeting expands SI using the product's current terminology.
- assertVisible: "Strategic Intelligence"
