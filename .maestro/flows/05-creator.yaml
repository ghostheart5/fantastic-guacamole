# P1 — Creator. The only way a user gets data into the app.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

# On a fresh account Nexus leads with the first-run call to action.
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"

- runFlow:
    when:
      notVisible: "CREATOR"
    commands:
      - runFlow:
          file: ../subflows/open-from-nexus.yaml
          env:
            TARGET: "Creator"

- assertVisible: "CREATOR"

- tapOn: "Title *"
- inputText: "Maestro smoke task"
- hideKeyboard

- scrollUntilVisible:
    element:
      text: "CREATE TASK"
    direction: DOWN
    timeout: 10000
- tapOn: "CREATE TASK"

# Creating routes to Timeline and the task must actually be there.
- extendedWaitUntil:
    visible: "Maestro smoke task"
    timeout: 15000
