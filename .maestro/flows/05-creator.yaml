# P1 — Creator. The only way a user gets data into the app.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

# On a fresh account Nexus leads with the first-run call to action.
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"

- runFlow:
    when:
      notVisible: "CREATOR"
    commands:
      - runFlow:
          file: ../subflows/open-from-nexus.yaml
          env:
            TARGET: "Creator"

- assertVisible: "CREATOR"

- tapOn: "Title *"
- inputText: "Maestro smoke task"
# Maestro's Android hideKeyboard sends Back even when an interrupted IME is gone.
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Schedule date and time"
    direction: DOWN
    timeout: 10000
- tapOn: "Schedule date and time"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

- scrollUntilVisible:
    element:
      text: "REVIEW CHANGES"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "REVIEW CHANGES"
    retryTapIfNoChange: true

# Creator is a two-step, explicitly confirmed write boundary.
- extendedWaitUntil:
    visible: "CONFIRM CREATOR CHANGES"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"

# The confirmed creation routes to Timeline and the task must actually be there.
- extendedWaitUntil:
    visible: "(?s).*Maestro smoke task.*Task is scheduled for a planned work time.*SCHEDULED.*"
    timeout: 15000

# A saved rhythm must remain reachable, and its period outcome must survive
# closing the library. This runs only on the disposable hosted QA account.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Creator"
- tapOn: "Task"
- tapOn: "Daily Rhythm"
- tapOn: "Title *"
- inputText: "Maestro review rhythm"
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn: "REVIEW CHANGES"
- extendedWaitUntil:
    visible: "CONFIRM CREATOR CHANGES"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- extendedWaitUntil:
    visible: "(?s).*Confirmed and saved exactly once.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Manage Daily Rhythms"
    direction: UP
    timeout: 10000
- tapOn: "Manage Daily Rhythms"
- assertVisible: "Maestro review rhythm"
- tapOn: "Pause"
- assertVisible: "Resume"
- assertVisible:
    text: "Mark target completed"
    enabled: false
- tapOn: "Resume"
- tapOn: "Mark target completed"
- extendedWaitUntil:
    visible: "Completed this day"
    timeout: 10000
- assertVisible:
    text: "Mark target completed"
    enabled: false
- back
- tapOn: "Manage Daily Rhythms"
- assertVisible: "Maestro review rhythm"
- assertVisible: "Completed this day"
- assertVisible:
    text: "Skip this day"
    enabled: false

# Reopen a saved goal on a cold process. Its account box must be prepared
# before synchronous goal readers populate the next task's linking control.
- back
- scrollUntilVisible:
    element:
      text: "Daily Rhythm"
    direction: DOWN
    timeout: 10000
- tapOn: "Daily Rhythm"
- tapOn: "Goal"
- tapOn: "Title *"
- eraseText: 50
- inputText: "Maestro preserved goal"
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn: "REVIEW CHANGES"
- extendedWaitUntil:
    visible: "CONFIRM CREATOR CHANGES"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- extendedWaitUntil:
    visible: "(?s).*Confirmed and saved exactly once.*"
    timeout: 10000
- stopApp
- launchApp
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Creator"
- scrollUntilVisible:
    element:
      text: "No linked goal"
    direction: DOWN
    timeout: 10000
- tapOn: "No linked goal"
- assertVisible: "Maestro preserved goal"
- back
