# P1 — Creator. The only way a user gets data into the app.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

# On a fresh account Nexus leads with the first-run call to action.
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"

- runFlow:
    when:
      notVisible: "CREATOR"
    commands:
      - runFlow:
          file: ../subflows/open-from-nexus.yaml
          env:
            TARGET: "Creator"

- assertVisible: "CREATOR"

# Android can merge the accessible label and visible hint in one node.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Maestro smoke task"
# Maestro's Android hideKeyboard sends Back even when an interrupted IME is gone.
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Schedule date and time"
    direction: DOWN
    timeout: 10000
- tapOn: "Schedule date and time"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"

- runFlow: ../subflows/reveal-creator-review.yaml
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "REVIEW CHANGES"
    retryTapIfNoChange: true

# Creator is a two-step, explicitly confirmed write boundary.
- runFlow: ../subflows/reveal-creator-confirmation.yaml
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"

# The confirmed creation routes to Timeline and the task must actually be there.
# The selected clock time can already be past; both copy branches represent an
# open scheduled task. Keep the task title and SCHEDULED marker mandatory.
- extendedWaitUntil:
    visible: "(?s).*Maestro smoke task.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*SCHEDULED.*"
    timeout: 15000

# A saved rhythm must remain reachable, and its period outcome must survive
# closing the library. This runs only on the disposable hosted QA account.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Creator"
- scrollUntilVisible:
    element:
      text: "Task"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Task"
- tapOn: "Daily Rhythm"
# Android can merge the accessible label and visible hint in one node.
# A saved-item receipt can keep the next form below the fold.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Maestro review rhythm"
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn: "REVIEW CHANGES"
- runFlow: ../subflows/reveal-creator-confirmation.yaml
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- extendedWaitUntil:
    visible: "(?s).*Confirmed and saved exactly once.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Manage Daily Rhythms"
    direction: UP
    visibilityPercentage: 100
    # This header can be fully visible at the top scroll boundary.
    centerElement: false
    timeout: 10000
- tapOn: "Manage Daily Rhythms"
# Android merges the card's title, cadence, and status into one readable node.
- assertVisible: "(?s)Maestro review rhythm\\n1 time per day.*"
- scrollUntilVisible:
    element:
      text: "Pause"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Pause"
- assertVisible: "Resume"
- assertVisible:
    text: "Mark target completed"
    enabled: false
- tapOn: "Resume"
- scrollUntilVisible:
    element:
      text: "Mark target completed"
    direction: UP
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Mark target completed"
- extendedWaitUntil:
    visible: "(?s)Maestro review rhythm\\n1 time per day.*\\nCompleted this day\\n.*"
    timeout: 10000
- assertVisible:
    text: "Mark target completed"
    enabled: false
- back
- scrollUntilVisible:
    element:
      text: "Manage Daily Rhythms"
    direction: UP
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Manage Daily Rhythms"
- assertVisible: "(?s)Maestro review rhythm\\n1 time per day.*\\nCompleted this day\\n.*"
- scrollUntilVisible:
    element:
      text: "Skip this day"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- assertVisible:
    text: "Skip this day"
    enabled: false

# Reopen a saved goal on a cold process. Its account box must be prepared
# before synchronous goal readers populate the next task's linking control.
- back
- scrollUntilVisible:
    element:
      text: "Daily Rhythm"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Daily Rhythm"
- tapOn: "Goal"
# Android can merge the accessible label and visible hint in one node.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- eraseText: 50
- inputText: "Maestro preserved goal"
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn: "REVIEW CHANGES"
- runFlow: ../subflows/reveal-creator-confirmation.yaml
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- extendedWaitUntil:
    visible: "(?s).*Confirmed and saved exactly once.*"
    timeout: 10000
- stopApp
- launchApp
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Creator"
- scrollUntilVisible:
    element:
      text: "No linked goal"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "No linked goal"
- assertVisible: "Maestro preserved goal"
- back
