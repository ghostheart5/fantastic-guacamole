# Manual Save authorizes one item through the existing guarded transaction.
# Retain receipt, schedule, habit lifecycle and cold-process goal readback.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Add something"
- assertVisible: 'Add something'
- assertVisible: 'Give it a name. Add details only if you need them.'

# Create and schedule exactly one task using the current optional controls.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Maestro smoke task"
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- scrollUntilVisible:
    element:
      text: '(?s)^Task options \(optional\).*'
    direction: DOWN
    timeout: 10000
- tapOn: '(?s)^Task options \(optional\).*'
- scrollUntilVisible:
    element:
      text: '^Schedule date and time(?:\.\.\.)?$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Schedule date and time(?:\.\.\.)?$'
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- scrollUntilVisible:
    element:
      text: '^Save task$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Save task$'
- runFlow:
    file: ../subflows/verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: 'Task: Maestro smoke task'
- scrollUntilVisible:
    element:
      text: "Open schedule"
    direction: DOWN
    timeout: 10000
- tapOn: "Open schedule"
- extendedWaitUntil:
    visible: '(?s).*Maestro smoke task.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*SCHEDULED.*'
    timeout: 15000
- back

# Open a fresh form, save a habit, and use the kind-correct readback action.
- scrollUntilVisible:
    element:
      text: "New item"
    direction: DOWN
    timeout: 10000
- tapOn: "New item"
- scrollUntilVisible:
    element:
      text: '^Task$'
    direction: UP
    centerElement: false
    timeout: 10000
- tapOn: '^Task$'
- tapOn: '^Habit$'
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Maestro review rhythm"
- scrollUntilVisible:
    element:
      text: '^Save habit$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Save habit$'
- runFlow:
    file: ../subflows/verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: 'Habit: Maestro review rhythm'
- tapOn: "Open habits"
- assertVisible: 'Maestro review rhythm'
- assertVisible: '(?s)^1 time per day.*'
- tapOn: '^Habit options(?:, (?:Collapsed|Expanded))?$'
- scrollUntilVisible:
    element:
      text: "Pause"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Pause"
- assertVisible: "Resume"
- assertVisible:
    text: "Mark target completed"
    enabled: false
- tapOn: "Resume"
- scrollUntilVisible:
    element:
      text: "Mark target completed"
    direction: UP
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "Mark target completed"
- extendedWaitUntil:
    visible: 'Completed this day'
    timeout: 10000
- assertVisible: 'Maestro review rhythm'
- assertVisible: '(?s)^1 time per day.*'
- assertVisible:
    text: "Mark target completed"
    enabled: false
- back
- scrollUntilVisible:
    element:
      text: "Open habits"
    direction: UP
    centerElement: false
    timeout: 10000
- tapOn: "Open habits"
- assertVisible: 'Maestro review rhythm'
- assertVisible: '(?s)^1 time per day.*'
- assertVisible: 'Completed this day'
- scrollUntilVisible:
    element:
      text: "Skip this day"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- assertVisible:
    text: "Skip this day"
    enabled: false
- back

# A fresh goal form saves one goal. A cold process must reopen its canonical
# box before the next task's linking control reads that goal.
- scrollUntilVisible:
    element:
      text: "New item"
    direction: DOWN
    timeout: 10000
- tapOn: "New item"
- scrollUntilVisible:
    element:
      text: '^Habit$'
    direction: UP
    centerElement: false
    timeout: 10000
- tapOn: '^Habit$'
- tapOn: '^Goal$'
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Maestro preserved goal"
- scrollUntilVisible:
    element:
      text: '^Save goal$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Save goal$'
- runFlow:
    file: ../subflows/verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: 'Goal: Maestro preserved goal'
- stopApp
- launchApp
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Add something"
- scrollUntilVisible:
    element:
      text: '(?s)^Task options \(optional\).*'
    direction: DOWN
    timeout: 10000
- tapOn: '(?s)^Task options \(optional\).*'
- scrollUntilVisible:
    element:
      text: "No linked goal"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: "No linked goal"
- assertVisible: "Maestro preserved goal"
- back
