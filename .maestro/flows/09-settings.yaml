# P2 — Settings. Non-destructive checks only; deletion lives in flow 12.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Settings"

- scrollUntilVisible:
    element:
      text: "Data & account\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Data & account\\n.*"

# Require one real account-mode control before selecting the matching branch.
# A missing selector must not silently skip every account assertion.
- scrollUntilVisible:
    element:
      text: "(?:Exit Tester Mode|Log Out)\\. .*"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "(?:Exit Tester Mode|Log Out)\\. .*"
    enabled: true

# Tester mode must expose only tester-safe account controls.
- runFlow:
    when:
      visible: "Exit Tester Mode\\. .*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Clear Local Data\\. .*"
          direction: DOWN
          timeout: 15000
      - assertVisible:
          text: "Clear Local Data\\. .*"
          enabled: true
      - scrollUntilVisible:
          element:
            text: "Reset Tester Data\\. .*"
          direction: DOWN
          timeout: 15000
      - assertVisible:
          text: "Reset Tester Data\\. .*"
          enabled: true
      - assertNotVisible: "Delete Account\\. .*"

# A real-account build must retain both sign-out and account deletion access.
- runFlow:
    when:
      visible: "Log Out\\. .*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Delete Account\\. .*"
          direction: DOWN
          timeout: 15000
      - assertVisible:
          text: "Delete Account\\. .*"
          enabled: true
