# My plan retains both the task library and the real dated schedule.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "My plan"
- assertVisible: "My plan"
- assertVisible: "Tasks"
- assertVisible: "Completed"
- assertVisible: "Notes"
- tapOn: "Schedule"
- assertVisible: 'Schedule'
- assertVisible: 'See tasks with dates and past activity. Open a task to update it.'
