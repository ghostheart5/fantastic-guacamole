# P0 - First-run welcome. Account-scoped guidance continues after sign-in;
# this journey verifies the public first-run page and its authentication handoff.
appId: com.ghostheart5.chronospark
tags:
  - critical
  - onboarding
---
- launchApp:
    clearState: true

- assertVisible: "CHRONOSPARK"
- assertVisible: "A living decision system"
- assertVisible: "Plan with purpose. Act. Learn. ChronoSpark keeps the context behind your decisions."
- assertVisible: "CONTINUE TO LOGIN"

- tapOn: "CONTINUE TO LOGIN"
- extendedWaitUntil:
    visible: "ENTER SYSTEM"
    timeout: 10000
