# P0 — Onboarding. Content-versioned: bumping TutorialContent.contentVersion
# replays this for existing users, so a regression here hits everyone, not just
# new installs.
appId: com.ghostheart5.chronospark
tags:
  - critical
  - onboarding
---
- launchApp:
    clearState: true

- assertVisible: "CHRONOSPARK"

# Slide 2 is personalization. Feature education continues through the
# account-scoped adaptive guide after onboarding.
- tapOn: "NEXT"
- assertVisible: "PERSONALIZE"

- runFlow: ../subflows/skip-onboarding.yaml
