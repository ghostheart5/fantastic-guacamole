# Priority 8 — local QA Account A -> B -> A preservation and isolation.
appId: com.ghostheart5.chronospark
tags:
  - priority8
  - auth
  - isolation
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in-qa.yaml

- runFlow:
    file: ../subflows/create-scheduled-task.yaml
    env:
      TASK_TITLE: "P8 Account A Sentinel"
- assertVisible: "(?s).*P8 Account A Sentinel.*"
- runFlow: ../subflows/return-from-schedule-to-today.yaml

- runFlow: ../subflows/exit-tester-account.yaml
- tapOn: "TESTER B.*ISOLATION LOGIN"
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 30000
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "My plan"
- assertNotVisible: "(?s).*P8 Account A Sentinel.*"

- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Add something"
- runFlow:
    file: ../subflows/create-scheduled-task.yaml
    env:
      TASK_TITLE: "P8 Account B Sentinel"
- assertVisible: "(?s).*P8 Account B Sentinel.*"
- assertNotVisible: "(?s).*P8 Account A Sentinel.*"
- runFlow: ../subflows/return-from-schedule-to-today.yaml

- runFlow: ../subflows/exit-tester-account.yaml
- tapOn: "TESTER ACCESS.*TEST LOGIN"
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 30000
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "My plan"
- extendedWaitUntil:
    visible: "(?s).*P8 Account A Sentinel.*"
    timeout: 20000
- assertNotVisible: "(?s).*P8 Account B Sentinel.*"
