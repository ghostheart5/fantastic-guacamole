# Priority 8 — one canonical, restart-safe learned-lifecycle journey.
#
# This intentionally stays in one app-data lifecycle. It proves that a real
# Planner recommendation crosses the Creator confirmation boundary, becomes a
# scheduled Timeline task, records a reviewable learning change on completion,
# and retains the underlying account-scoped outcome across a process restart.
appId: com.ghostheart5.chronospark
tags:
  - priority8
  - journey
---
- launchApp:
    clearState: true

# QA may show Welcome after clear-state. The local helper follows the visible
# welcome handoff and then requires isolated tester access; no real credentials.
- runFlow: ../subflows/sign-in-qa.yaml

# First-run Creator -> Timeline. Completing this seed leaves the later
# Planner-created task as the only open scheduled task in the journey.
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"
- runFlow:
    when:
      notVisible: "CREATOR"
    commands:
      - runFlow:
          file: ../subflows/open-from-nexus.yaml
          env:
            TARGET: "Creator"
- assertVisible: "CREATOR"
# Android can merge the accessible label and visible hint in one node.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "Priority 8 journey seed"
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Schedule date and time"
    direction: DOWN
    timeout: 10000
- tapOn: "Schedule date and time"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- runFlow: ../subflows/reveal-creator-review.yaml
# Match the Creator smoke flow: finish picker/IME layout transitions before
# resolving the button's tap position, then require the real preview handoff.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "REVIEW CHANGES"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "CONFIRM CREATOR CHANGES"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- extendedWaitUntil:
    visible: "(?s).*Priority 8 journey seed.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Complete"
    direction: DOWN
    timeout: 10000
- tapOn: "Complete"
- extendedWaitUntil:
    visible: "(?s).*Task Completed.*Priority 8 journey seed marked complete.*"
    timeout: 20000
# Timeline's back control scrolls with its header above the completed task.
- scrollUntilVisible:
    element:
      text: "Back to Nexus"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: "Back to Nexus"
- extendedWaitUntil:
    visible: "NEXUS"
    timeout: 10000

# Nexus -> Smart Planner input/output -> explicit Use this plan acceptance.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Smart Planner"
- assertVisible: "Back\\nPLAN SPECTRUM\\nSmart Planner\\nBuild your next plan from real evidence."
- scrollUntilVisible:
    element:
      text: "What would you like help planning right now\\?"
    direction: DOWN
    timeout: 15000
# Require the editable child and typed-text readback, not the whole check-in card.
- tapOn: "What would you like help planning right now\\?"
- assertVisible:
    text: "What would you like help planning right now\\?"
    focused: true
- runFlow:
    file: ../subflows/enter-planner-request.yaml
    env:
      REQUEST: "Finish the Priority 8 release evidence today"
- scrollUntilVisible:
    element:
      text: "Finish the Priority 8 release evidence today"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    text: "Finish the Priority 8 release evidence today"
- scrollUntilVisible:
    element:
      text: "GET GUIDANCE"
    direction: DOWN
    timeout: 15000
- tapOn: "GET GUIDANCE"
- extendedWaitUntil:
    visible: "(?s)Planning guidance ready.*"
    timeout: 30000
- runFlow: ../subflows/answer-planner-saved-context.yaml
- assertVisible: "Use this plan"
- tapOn: "Use this plan"

# The Planner draft is still read-only until Creator review and confirmation.
# Add a schedule so the confirmed task exposes the real Timeline completion
# control rather than only an informational creation event.
- extendedWaitUntil:
    visible: "PLANNER DRAFT PREVIEW"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Schedule date and time"
    direction: DOWN
    timeout: 10000
- tapOn: "Schedule date and time"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 5000
# A long Planner notes field can occupy the viewport center and consume the
# default scrollUntilVisible gesture. Scroll the outer form's side gutter.
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn:
    text: "REVIEW CHANGES"
    retryTapIfNoChange: true
# The longer Planner preview retains the form's scroll offset. Review its
# heading before scrolling down to the explicit confirmation control.
- scrollUntilVisible:
    element:
      text: "CONFIRM CREATOR CHANGES"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "CONFIRM CREATOR CHANGES"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "CONFIRM SELECTED"
    direction: DOWN
    timeout: 10000
- tapOn: "CONFIRM SELECTED"
- scrollUntilVisible:
    element:
      text: "CREATION SAVED"
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: "CREATION SAVED"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Open Timeline"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: "Open Timeline"
- extendedWaitUntil:
    visible: "TIMELINE"
    timeout: 10000
# The fresh QA Planner's best-fit title is deterministic. Require its scheduled
# row and completion so the earlier seed outcome cannot satisfy this handoff.
- extendedWaitUntil:
    visible: "(?s).*Complete one useful cycle.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Complete"
    direction: DOWN
    timeout: 10000
- tapOn: "Complete"
- extendedWaitUntil:
    visible: "(?s).*Task Completed.*Complete one useful cycle marked complete.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Back to Nexus"
    direction: UP
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: "Back to Nexus"

# The latest completion must publish an explainable, correctable change.
- extendedWaitUntil:
    visible: "WHAT LEARNING CHANGED"
    timeout: 20000
- assertVisible: ".*completed outcome.*"

# Process restart: preserve app data, then prove the account-scoped ledger
# retained a completed task-lifecycle outcome. Task-specific subject identity
# is checked by the persistence integration regression; this UI row is generic.
- stopApp
- launchApp
- runFlow: ../subflows/sign-in-qa.yaml
- extendedWaitUntil:
    visible: "NEXUS"
    timeout: 30000
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Settings"
- scrollUntilVisible:
    element:
      text: "Planning & guidance\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Planning & guidance\\n.*"
# Traverse the long expanded category before requiring the actual saved row.
- scrollUntilVisible:
    element:
      text: "RECENT RAW OBSERVATIONS"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*Task Lifecycle.*completed.*Completed the task.*helped.*"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 15000
- assertVisible: "(?s).*Task Lifecycle.*completed.*Completed the task.*helped.*"
