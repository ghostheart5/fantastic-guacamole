# Priority 8 — one canonical, restart-safe learned-lifecycle journey.
#
# This intentionally stays in one app-data lifecycle. It proves that a real
# Planner recommendation crosses the Creator confirmation boundary, becomes a
# scheduled Timeline task, records a reviewable learning change on completion,
# and retains the underlying account-scoped outcome across a process restart.
appId: com.ghostheart5.chronospark
tags:
  - priority8
  - journey
---
- launchApp:
    clearState: true

# QA may show Welcome after clear-state. The local helper follows the visible
# welcome handoff and then requires isolated tester access; no real credentials.
- runFlow: ../subflows/sign-in-qa.yaml

# First-run Creator -> Timeline. Completing this seed leaves the later
# Planner-created task as the only open scheduled task in the journey.
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"
- runFlow:
    when:
      notVisible: "Add something"
    commands:
      - runFlow:
          file: ../subflows/open-from-nexus.yaml
          env:
            TARGET: "Add something"
- assertVisible: "Add something"
# Android can merge the accessible label and visible hint in one node.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- runFlow:
    file: ../subflows/enter-planner-request.yaml
    env:
      REQUEST: "Priority 8 journey seed"
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: '(?s)^Task options \(optional\).*'
    direction: DOWN
    timeout: 10000
- tapOn: '(?s)^Task options \(optional\).*'
- scrollUntilVisible:
    element:
      text: '^Schedule date and time(?:\.\.\.)?$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Schedule date and time(?:\.\.\.)?$'
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- scrollUntilVisible:
    element:
      text: '^Save task$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Save task$'
- runFlow:
    file: ../subflows/verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: "Task: Priority 8 journey seed"
- scrollUntilVisible:
    element:
      text: "Open schedule"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: "Open schedule"
- extendedWaitUntil:
    visible: "Schedule"
    timeout: 10000
- extendedWaitUntil:
    visible: "(?s).*Priority 8 journey seed.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Complete"
    direction: DOWN
    timeout: 10000
- tapOn: "Complete"
- extendedWaitUntil:
    visible: "(?s).*Task Completed.*Priority 8 journey seed marked complete.*"
    timeout: 20000
# Timeline's back control scrolls with its header above the completed task.
# The top boundary cannot center this header; require the whole control instead.
- back
- extendedWaitUntil:
    visible: '^Add something$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^Back to Today$'
    direction: UP
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Back to Today$'
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 10000

# Nexus -> Smart Planner input/output -> explicit Use this plan acceptance.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Choose a step"
- assertVisible: '(?s)^(?:.*\n)?Choose a step(?:\n.*)?$'
- assertVisible: '(?s)^(?:.*\n)?Describe what you need to do\. Get a manageable next step to review\.(?:\n.*)?$'
- scrollUntilVisible:
    element:
      text: "What would you like help planning right now\\?"
    direction: DOWN
    timeout: 15000
# Require the editable child and typed-text readback, not the whole check-in card.
- tapOn: "What would you like help planning right now\\?"
- assertVisible:
    text: "What would you like help planning right now\\?"
    focused: true
- runFlow:
    file: ../subflows/enter-planner-request.yaml
    env:
      REQUEST: "Fold one shirt. I have five minutes."
- scrollUntilVisible:
    element:
      text: "Fold one shirt. I have five minutes."
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    text: "Fold one shirt. I have five minutes."
- scrollUntilVisible:
    element:
      text: "Get a suggestion"
    direction: DOWN
    timeout: 15000
- tapOn: "Get a suggestion"
- extendedWaitUntil:
    visible: "(?s)Planning guidance ready.*"
    timeout: 30000
- runFlow: ../subflows/answer-planner-saved-context.yaml
- scrollUntilVisible:
    element:
      text: "Use this plan"
    direction: DOWN
    timeout: 15000
- assertVisible: "Use this plan"
- tapOn: "Use this plan"

# The Planner draft is still read-only until Creator review and confirmation.
# Add a schedule so the confirmed task exposes the real Timeline completion
# control rather than only an informational creation event.
- extendedWaitUntil:
    visible: '^Suggested draft$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '(?s)^Task options \(optional\).*'
    direction: DOWN
    timeout: 10000
- tapOn: '(?s)^Task options \(optional\).*'
- scrollUntilVisible:
    element:
      text: '^Schedule date and time(?:\.\.\.)?$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Schedule date and time(?:\.\.\.)?$'
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 5000
# A long Planner notes field can occupy the viewport center and consume the
# default scrollUntilVisible gesture. Scroll the outer form's side gutter.
- runFlow: ../subflows/reveal-creator-review.yaml
- tapOn:
    text: '^Review before saving$'
    retryTapIfNoChange: true
# The longer Planner preview retains the form's scroll offset. Review its
# heading before scrolling down to the explicit confirmation control.
- scrollUntilVisible:
    element:
      text: '^Ready to save\?$'
    direction: UP
    timeout: 10000
- extendedWaitUntil:
    visible: '^Ready to save\?$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^Save task$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Save task$'
- runFlow:
    file: ../subflows/verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: 'Task: Fold one shirt'
- scrollUntilVisible:
    element:
      text: "Open schedule"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: "Open schedule"
- extendedWaitUntil:
    visible: "Schedule"
    timeout: 10000
# The concrete Planner action must keep its title through Creator. Require its scheduled
# row and completion so the earlier seed outcome cannot satisfy this handoff.
- extendedWaitUntil:
    visible: "(?s).*Fold one shirt.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Complete"
    direction: DOWN
    timeout: 10000
- tapOn: "Complete"
- extendedWaitUntil:
    visible: "(?s).*Task Completed.*Fold one shirt marked complete.*"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: '^Add something$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^Back to Today$'
    direction: UP
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Back to Today$'

# Today keeps the detailed learning panel behind its explicit review entry.
- extendedWaitUntil:
    visible: '^Today$'
    timeout: 10000
- scrollUntilVisible:
    element:
      text: '^Review my day in detail$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 15000
- tapOn: '^Review my day in detail$'

# The latest completion must publish an explainable, correctable change.
- scrollUntilVisible:
    element:
      text: '^What changed after your feedback$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 20000
- extendedWaitUntil:
    visible: '^What changed after your feedback$'
    timeout: 20000
- assertVisible: ".*completed outcome.*"

# Process restart: preserve app data, then prove the account-scoped ledger
# retained a completed task-lifecycle outcome. Task-specific subject identity
# is checked by the persistence integration regression; this UI row is generic.
- stopApp
- launchApp
- runFlow: ../subflows/sign-in-qa.yaml
- extendedWaitUntil:
    visible: "^Today$"
    timeout: 30000
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Settings"
- scrollUntilVisible:
    element:
      text: "Planning & guidance\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Planning & guidance\\n.*"
# Traverse the long expanded category before requiring the actual saved row.
- scrollUntilVisible:
    element:
      text: "RECENT RAW OBSERVATIONS"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "(?s).*Task Lifecycle.*completed.*Completed the task.*helped.*"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 15000
- assertVisible: "(?s).*Task Lifecycle.*completed.*Completed the task.*helped.*"
