# P1 — Logout. Verifies session teardown actually revokes access.
appId: com.ghostheart5.chronospark
tags:
  - auth
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Control Center"

- scrollUntilVisible:
    element:
      text: "Data & account\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Data & account\\n.*"

- scrollUntilVisible:
    element:
      text: "(?:Close Profile|Exit Tester Mode|Log Out)\\. .*"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "(?:Close Profile|Exit Tester Mode|Log Out)\\. .*"
    enabled: true
- tapOn: "(?:Close Profile|Exit Tester Mode|Log Out)\\. .*"

- extendedWaitUntil:
    visible: "(?:CONTINUE TO (?:LOGIN|PROFILE)|ENTER SYSTEM|TESTER ACCESS.*TEST LOGIN|Open profile)"
    timeout: 20000

# Signing out must not leave the app surface reachable behind the gate.
- assertNotVisible: "Open navigation map"
