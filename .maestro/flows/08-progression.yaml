# The Activity destination preserves the recorded progression review.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Activity"
- assertVisible: '(?s).*Your recorded progress.*Activity.*Review completed tasks and recorded milestones. You can start again at any time\..*'
