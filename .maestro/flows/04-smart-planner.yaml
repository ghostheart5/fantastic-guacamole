# P1 — Smart Planner. The core value proposition.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

# Navigate through the shell's canonical destination map.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Smart Planner"

- assertVisible: "Back\\nPLAN SPECTRUM\\nSmart Planner\\nBuild your next plan from real evidence."

# The canonical destination must not regress to a retired product label.
- assertNotVisible: "SMART COACH"

# Exercise a real local Planner input/output cycle. The QA profile keeps
# external AI contained, so this proves deterministic on-device guidance.
- scrollUntilVisible:
    element:
      text: "What would you like help planning right now\\?"
    direction: DOWN
    timeout: 15000
# The failed selector matched the whole check-in card. The exact observed
# editable child has this hint and was clickable at [107,1658][973,1950].
- tapOn: "What would you like help planning right now\\?"
- assertVisible:
    text: "What would you like help planning right now\\?"
    focused: true
- runFlow:
    file: ../subflows/enter-planner-request.yaml
    env:
      REQUEST: "Finish the release evidence today"
# Scroll the complete editable field into view without sending Android Back,
# which can pop this route when Maestro has already dismissed the IME.
- scrollUntilVisible:
    element:
      text: "Finish the release evidence today"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible:
    text: "Finish the release evidence today"
- scrollUntilVisible:
    element:
      text: "GET GUIDANCE"
    direction: DOWN
    timeout: 15000
- tapOn: "GET GUIDANCE"
- extendedWaitUntil:
    visible: "(?s)Planning guidance ready.*"
    timeout: 30000
- runFlow: ../subflows/answer-planner-saved-context.yaml
- assertVisible: "Use this plan"
# The follow-up keyboard can leave the lower response actions off screen.
# Scroll to the evidence action before asserting it exists.
- scrollUntilVisible:
    element:
      text: "Evidence"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 15000
- assertVisible: "Evidence"
- assertNotVisible: "External AI"
