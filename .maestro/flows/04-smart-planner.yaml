# P1 — Smart Planner. The core value proposition.
appId: com.ghostheart5.chronospark
tags:
  - core
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml

# Navigate through the shell's canonical destination map.
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Smart Planner"

- assertVisible: "Back\\nPLAN SPECTRUM\\nSmart Planner\\nBuild your next plan from real evidence."

# The canonical destination must not regress to a retired product label.
- assertNotVisible: "SMART COACH"

# Exercise a real local Planner input/output cycle. The QA profile keeps
# external AI contained, so this proves deterministic on-device guidance.
- tapOn: "Not set"
- inputText: "Finish the release evidence today"
- scrollUntilVisible:
    element:
      text: "GET GUIDANCE"
    direction: DOWN
    timeout: 15000
- tapOn: "GET GUIDANCE"
- extendedWaitUntil:
    visible: "(?s)Planning guidance ready.*"
    timeout: 30000
- assertVisible: "Use this plan"
- assertVisible: "Evidence"
- assertNotVisible: "External AI"
