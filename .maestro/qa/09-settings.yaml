# EMULATOR ONLY. Require the configured local-profile controls without skips.
appId: com.ghostheart5.chronospark
tags: [qa, core, settings]
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in-qa.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Settings"
- scrollUntilVisible:
    element:
      text: "Data & account\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Data & account\\n.*"
- scrollUntilVisible:
    element:
      text: "Close Profile\\. Close this profile and keep its data on this device\\."
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Close Profile\\. Close this profile and keep its data on this device\\."
    enabled: true
- scrollUntilVisible:
    element:
      text: "Clear Local Data\\. Remove saved planning data, offline actions, notifications, and local intelligence from this device\\."
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Clear Local Data\\. Remove saved planning data, offline actions, notifications, and local intelligence from this device\\."
    enabled: true
- scrollUntilVisible:
    element:
      text: "Delete Local Profile\\. Permanently remove this profile and its data from this device\\."
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Delete Local Profile\\. Permanently remove this profile and its data from this device\\."
    enabled: true
- assertNotVisible: "Delete Account\\. .*"
- assertNotVisible: "Log Out\\. .*"
- assertNotVisible: "Exit Tester Mode\\. .*"
- assertNotVisible: "Reset Tester Data\\. .*"
