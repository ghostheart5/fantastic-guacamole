# EMULATOR ONLY. Close the isolated local profile and preserve its data.
appId: com.ghostheart5.chronospark
tags: [qa, auth]
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in-qa.yaml
- runFlow:
    file: ../subflows/open-from-nexus.yaml
    env:
      TARGET: "Settings"
- scrollUntilVisible:
    element:
      text: "Data & account\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Data & account\\n.*"
- scrollUntilVisible:
    element:
      text: "Close Profile\\. Close this profile and keep its data on this device\\."
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Close Profile\\. Close this profile and keep its data on this device\\."
    enabled: true
- tapOn: "Close Profile\\. Close this profile and keep its data on this device\\."
- runFlow: ../subflows/skip-onboarding.yaml
- extendedWaitUntil:
    visible: "(?:CONTINUE TO (?:LOGIN|PROFILE)|ENTER SYSTEM|TESTER ACCESS.*TEST LOGIN|Open profile)"
    timeout: 20000
# The original session-teardown assertion is retained.
- assertNotVisible: "Open navigation map"
- assertNotVisible: "Could not log out\\. Please try again\\."
