# Shared: authenticate and land on Today.
#
# Used by every flow that tests something behind the login gate, so those flows
# assert their own feature rather than re-asserting authentication.
appId: com.ghostheart5.chronospark
---
- runFlow: skip-onboarding.yaml

- runFlow:
    when:
      visible: "(?:Create profile|Open profile)"
    commands:
      - tapOn: "(?:Create profile|Open profile)"
      - extendedWaitUntil:
          visible: "(?:Go to Today|SKIP FOR NOW|Pause guide|Today)"
          timeout: 20000

# Creating the local profile reveals the authenticated final setup step.
- runFlow:
    when:
      visible: "Go to Today"
    commands:
      - tapOn: "Go to Today"

- runFlow:
    when:
      visible: "TESTER ACCESS.*TEST LOGIN"
    commands:
      - tapOn: "TESTER ACCESS.*TEST LOGIN"

- runFlow:
    when:
      visible: "ENTER SYSTEM"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn:
          text: "Password"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - hideKeyboard
      - tapOn: "ENTER SYSTEM"

- extendedWaitUntil:
    visible: "(?:Pause guide|Today)"
    timeout: 20000
- tapOn:
    text: "Pause guide"
    optional: true

- extendedWaitUntil:
    visible: "Today"
    timeout: 20000

- tapOn:
    text: "Pause guide"
    optional: true
- assertNotVisible: "Pause guide"

# Authentication must reveal the usable Today action, not only a heading.
- assertVisible: "Add a goal, task or habit"
