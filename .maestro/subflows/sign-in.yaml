# Shared: authenticate and land on Nexus.
#
# Used by every flow that tests something behind the login gate, so those flows
# assert their own feature rather than re-asserting authentication.
appId: com.ghostheart5.chronospark
---
- runFlow: skip-onboarding.yaml

- runFlow:
    when:
      visible: "(?:Create profile|Open profile)"
    commands:
      - tapOn: "(?:Create profile|Open profile)"
      - extendedWaitUntil:
          visible: "(?:SKIP FOR NOW|Pause guide|NEXUS.*)"
          timeout: 20000

# Creating the local profile reveals the authenticated final setup step.
- runFlow:
    when:
      visible: "SKIP FOR NOW"
    commands:
      - tapOn: "SKIP FOR NOW"

- runFlow:
    when:
      visible: "TESTER ACCESS.*TEST LOGIN"
    commands:
      - tapOn: "TESTER ACCESS.*TEST LOGIN"

- runFlow:
    when:
      visible: "ENTER SYSTEM"
    commands:
      - tapOn:
          text: "Email address"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn:
          text: "Password"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - hideKeyboard
      - tapOn: "ENTER SYSTEM"

- extendedWaitUntil:
    visible: "(?:Pause guide|NEXUS.*)"
    timeout: 20000
- tapOn:
    text: "Pause guide"
    optional: true

- extendedWaitUntil:
    visible: "NEXUS.*"
    timeout: 20000

- tapOn:
    text: "Pause guide"
    optional: true
- assertNotVisible: "Pause guide"
