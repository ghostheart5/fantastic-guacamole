appId: com.ghostheart5.chronospark
---
- runFlow:
    when:
      visible: "Start here"
    commands:
      - tapOn: "Turn an intention into a path"
- runFlow:
    when:
      notVisible: "Add something"
    commands:
      - runFlow:
          file: open-from-nexus.yaml
          env:
            TARGET: "Add something"
- extendedWaitUntil:
    visible: "Add something"
    timeout: 15000
# Android can merge the accessible label and visible hint in one node.
- scrollUntilVisible:
    element:
      text: '^Title, required(?:\s+Title \*)?$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 10000
- tapOn: '^Title, required(?:\s+Title \*)?$'
- inputText: "${TASK_TITLE}"
- tapOn:
    text: "(?:Done|Enter)"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: '(?s)^Task options \(optional\).*'
    direction: DOWN
    timeout: 10000
- tapOn: '(?s)^Task options \(optional\).*'
- scrollUntilVisible:
    element:
      text: '^Schedule date and time(?:\.\.\.)?$'
    direction: DOWN
    timeout: 10000
- tapOn: '^Schedule date and time(?:\.\.\.)?$'
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- tapOn: "OK"
- scrollUntilVisible:
    element:
      text: '^Save task$'
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
    timeout: 10000
- tapOn: '^Save task$'
- runFlow:
    file: verify-creator-saved-receipt.yaml
    env:
      SAVED_ITEM: 'Task: ${TASK_TITLE}'
- scrollUntilVisible:
    element:
      text: "Open schedule"
    direction: DOWN
    timeout: 10000
- tapOn: "Open schedule"
- extendedWaitUntil:
    visible: "(?s).*${TASK_TITLE}.*(?:Task is scheduled for a planned work time|Scheduled work time has passed. The task remains open; no deadline was missed).*"
    timeout: 20000
