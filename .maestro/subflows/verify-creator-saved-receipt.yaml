appId: com.ghostheart5.chronospark
---
# Require the durable receipt, exactly one saved change, and the requested item.
# The manual Save action already authorizes that one entered item. AI drafts
# retain their separate review; this helper does not confirm them implicitly.
- extendedWaitUntil:
    visible: '^Saved$'
    timeout: 10000
- assertVisible: '^Saved\.$'
- assertVisible: '^1 change saved\.$'
- assertVisible: '^${SAVED_ITEM}$'
- assertVisible: 'Undo save'
