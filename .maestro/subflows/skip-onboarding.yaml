# Shared: get past onboarding without re-testing it.
#
# Welcome still hands off to authentication. Once the authenticated final step
# is visible, Go to Today completes setup without creating anything.
appId: com.ghostheart5.chronospark
---
- extendedWaitUntil:
    visible: "(?:CONTINUE TO LOGIN|CONTINUE TO PROFILE|Start login|Go to Today|SKIP FOR NOW|Create profile|Open profile|TESTER ACCESS.*TEST LOGIN|ENTER SYSTEM|Today)"
    timeout: 30000

- runFlow:
    when:
      visible: "CONTINUE TO (?:LOGIN|PROFILE)"
    commands:
      - tapOn: "CONTINUE TO (?:LOGIN|PROFILE)"
      - waitForAnimationToEnd:
          timeout: 5000

# The login guide only reveals the form; it grants no privacy consent.
- runFlow:
    when:
      visible: "Start login"
    commands:
      # The target reveal can move the modal action while the entry animation
      # settles. Wait for its final position and require the guide to close.
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          text: "Start login"
          retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 5000
      # The first accessibility tap can race the guide's focus scroll: Maestro
      # sees the layout move and treats that as a UI change even if the button
      # was not pressed. Reacquire its final bounds only while it remains open.
      - runFlow:
          when:
            visible: "Start login"
          commands:
            - tapOn: "Start login"
            - waitForAnimationToEnd:
                timeout: 5000
      - assertNotVisible: "Start login"

# The form's semantics are hidden while the modal guide is open, so this wait
# cannot succeed by observing controls behind an undismissed tutorial.
- extendedWaitUntil:
    visible: "(?:Go to Today|SKIP FOR NOW|Create profile|Open profile|TESTER ACCESS.*TEST LOGIN|ENTER SYSTEM|Today)"
    timeout: 20000

- runFlow:
    when:
      visible: "Go to Today"
    commands:
      - tapOn: "Go to Today"
      - waitForAnimationToEnd:
          timeout: 5000
