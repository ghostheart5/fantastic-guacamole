# Shared: get past onboarding without re-testing it.
#
# Welcome still hands off to authentication. Once the authenticated final step
# is visible, SKIP FOR NOW completes setup without creating anything.
appId: com.ghostheart5.chronospark
---
- extendedWaitUntil:
    visible: "(?:CONTINUE TO LOGIN|TESTER ACCESS.*TEST LOGIN|ENTER SYSTEM|NEXUS)"
    timeout: 30000

- runFlow:
    when:
      visible: "CONTINUE TO LOGIN"
    commands:
      - tapOn: "CONTINUE TO LOGIN"
      - waitForAnimationToEnd:
          timeout: 5000

- extendedWaitUntil:
    visible: "(?:SKIP FOR NOW|TESTER ACCESS.*TEST LOGIN|ENTER SYSTEM|NEXUS)"
    timeout: 20000

- runFlow:
    when:
      visible: "SKIP FOR NOW"
    commands:
      - tapOn: "SKIP FOR NOW"
      - waitForAnimationToEnd:
          timeout: 5000
