# QA-only authentication. Never falls through to real account credentials.
appId: com.ghostheart5.chronospark
---
- runFlow: skip-onboarding.yaml
- extendedWaitUntil:
    visible: "(?:Create profile|Open profile|TESTER ACCESS.*TEST LOGIN|NEXUS.*)"
    timeout: 30000
- runFlow:
    when:
      visible: "(?:Create profile|Open profile)"
    commands:
      - tapOn: "(?:Create profile|Open profile)"
      - extendedWaitUntil:
          visible: "(?:SKIP FOR NOW|Pause guide|NEXUS.*)"
          timeout: 20000
- runFlow:
    when:
      visible: "SKIP FOR NOW"
    commands:
      - tapOn: "SKIP FOR NOW"
- runFlow:
    when:
      visible: "TESTER ACCESS.*TEST LOGIN"
    commands:
      - tapOn: "TESTER ACCESS.*TEST LOGIN"
- extendedWaitUntil:
    visible: "(?:Pause guide|NEXUS.*)"
    timeout: 20000
- tapOn:
    text: "Pause guide"
    optional: true
- extendedWaitUntil:
    visible: "NEXUS.*"
    timeout: 30000
- assertNotVisible: "ENTER SYSTEM"
- assertNotVisible: "Pause guide"
