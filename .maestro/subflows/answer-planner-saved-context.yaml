appId: com.ghostheart5.chronospark
---
# A fresh QA profile may have a generic saved recommendation. It must not
# replace an unrelated explicit request. Exercise the user's choice to keep
# planning independently, then require actionable guidance as before.
- runFlow:
    when:
      visible: "(?s).*Which saved task or goal, if any, should this plan support\\?.*"
    commands:
      - assertNotVisible: "Use this plan"
      - tapOn: "Follow-up question"
      - inputText: "None"
      - scrollUntilVisible:
          element:
            text: "None"
          direction: DOWN
          visibilityPercentage: 100
          timeout: 15000
      - assertVisible:
          text: "None"
      - scrollUntilVisible:
          element:
            text: "Send message"
          direction: DOWN
          timeout: 15000
      - tapOn: "Send message"
      # Sending scrolls to the chat history. The updated actionable response
      # panel is above that history, as verified on the release device.
      # Keep upward-page gestures above the open Android keyboard. The default
      # scroll gesture can end inside the IME and leave the page stationary.
      - repeat:
          times: 12
          commands:
            - runFlow:
                when:
                  notVisible: "Use this plan"
                commands:
                  - swipe:
                      start: "95%, 15%"
                      end: "95%, 45%"
                      duration: 500
                  - waitForAnimationToEnd:
                      timeout: 3000
      - scrollUntilVisible:
          element:
            text: "Use this plan"
          direction: UP
          centerElement: false
          timeout: 30000
      - assertNotVisible: "(?s).*ONE CLARIFYING QUESTION.*"
