appId: com.ghostheart5.chronospark
---
# Review can retain the form's scroll offset while Android's keyboard is open.
# Require the heading after moving the page, not just after waiting at its foot.
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible: '^Ready to save\?$'
          commands:
            - swipe:
                start: "95%, 15%"
                end: "95%, 45%"
                duration: 500
            - waitForAnimationToEnd:
                timeout: 3000
- assertVisible: '^Ready to save\?$'
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            notVisible: '^Check the selected change below\. Confirm to save it\.$'
          commands:
            - swipe:
                start: "95%, 45%"
                end: "95%, 15%"
                duration: 500
            - waitForAnimationToEnd:
                timeout: 3000
- assertVisible: '^Check the selected change below\. Confirm to save it\.$'
