# EMULATOR ONLY. Leaves QA identity data intact for A -> B -> A readback.
appId: com.ghostheart5.chronospark
---
- runFlow:
    file: open-from-nexus.yaml
    env:
      TARGET: "Settings"
- scrollUntilVisible:
    element:
      text: "Data & account\\n.*"
    direction: DOWN
    timeout: 15000
- tapOn: "Data & account\\n.*"
- scrollUntilVisible:
    element:
      text: "Exit Tester Mode\\. Return to login and disable the current tester sign-in state\\."
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Exit Tester Mode\\. Return to login and disable the current tester sign-in state\\."
    enabled: true
- tapOn: "Exit Tester Mode\\. Return to login and disable the current tester sign-in state\\."
- runFlow: skip-onboarding.yaml
- extendedWaitUntil:
    visible: "TESTER ACCESS.*TEST LOGIN"
    timeout: 20000
- assertNotVisible: "Open navigation map"
